<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Item tile redesign gallery</title>
<style>
  :root{
    --bg:#111512;
    --card:#1b211d;
    --surface-2:#28302a;
    --surface-3:#333c35;
    --fg:#eef2ee;
    --dim:#8b968e;
    --border:#333d36;
    --accent:#4ade80;
    --accent-fg:#08130c;
    --qty-bg:rgba(0,0,0,.62);
    --qty-fg:#fff;
    --qty-ring:rgba(255,255,255,.22);
    --shadow:0 10px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
  }
  html[data-theme="light"]{
    --bg:#f4f6f2;
    --card:#ffffff;
    --surface-2:#ecefe9;
    --surface-3:#e0e4dd;
    --fg:#141813;
    --dim:#5f6b61;
    --border:#d8ddd4;
    --accent:#16a34a;
    --accent-fg:#ffffff;
    --qty-bg:rgba(255,255,255,.92);
    --qty-fg:#141813;
    --qty-ring:rgba(0,0,0,.14);
    --shadow:0 10px 24px rgba(20,40,25,.14),0 2px 6px rgba(20,40,25,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:16px 16px 72px;
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--fg);
  }
  header{max-width:960px;margin:0 auto 18px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
  header p{margin:0 0 12px;color:var(--dim);font-size:13px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .controls button{
    font:inherit;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;
    border:1px solid transparent;background:var(--surface-2);color:var(--fg);cursor:pointer;
  }
  .controls button:hover{background:var(--surface-3)}
  .controls button.on{background:var(--accent);color:var(--accent-fg)}
  .controls .label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-left:6px}
  .pick{font-size:13px;font-weight:800;color:var(--accent);margin-left:auto}

  main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .card{
    position:relative;
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:14px 16px 16px;cursor:pointer;
    transition:border-color .12s,box-shadow .12s;
  }
  .card:hover{border-color:var(--dim)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
  .card-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:8px;background:var(--surface-2);
    font-size:12px;font-weight:900;color:var(--dim);flex:0 0 auto;
  }
  .card.sel .num{background:var(--accent);color:var(--accent-fg)}
  .card-head h2{font-size:15px;margin:0;font-weight:800}
  .tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);border:1px solid var(--border);border-radius:999px;padding:2px 8px}
  .pick-badge{display:none;font-size:11px;font-weight:800;color:var(--accent-fg);
    background:var(--accent);border-radius:999px;padding:3px 10px}
  .card.sel .pick-badge{display:inline-block}
  .card-desc{margin:7px 0 12px;color:var(--dim);font-size:12.5px;max-width:70ch}

  .stage{
    background:var(--bg);border-radius:12px;padding:14px;
    display:flex;justify-content:center;
  }
  .stage-inner{
    display:grid;gap:12px;width:100%;
    grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
  }
  body.phone .stage-inner{--cols:2;max-width:360px}
  body.desktop .stage-inner{--cols:4;max-width:820px}

  /* ============ shared tile (mirrors the app markup) ============ */
  .tile{
    position:relative;border:1px solid var(--border);border-radius:16px;
    background:var(--card);overflow:hidden;aspect-ratio:1/1;
  }
  .tile .count{
    position:relative;display:grid;grid-template-rows:1fr auto;
    width:100%;height:100%;margin:0;border:0;padding:0;
    background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;
  }
  .tile .count:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:16px}
  .pic{grid-row:1;grid-column:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:12px;position:relative}
  .pic img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .meta{grid-row:2;grid-column:1;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:8px 12px 12px;pointer-events:none}
  .name{font-size:12px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}
  .qty{
    font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;
    min-width:34px;min-height:34px;display:flex;align-items:center;justify-content:center;
    padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--fg);flex:0 0 auto;
  }
  .tile.counted .qty{background:var(--accent);color:var(--accent-fg)}
  .menu{
    position:absolute;top:5px;right:5px;z-index:5;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border:0;border-radius:9px;background:transparent;color:var(--dim);
    font:800 16px/1 system-ui;cursor:pointer;
  }
  .menu:hover{background:var(--surface-2);color:var(--fg)}
  .tile.bump .qty{animation:pop .22s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

  /* ============ 1 · baseline ============ */
  .v1 .tile{}

  /* ============ 2 · floating counter badge ============ */
  .v2 .pic{padding:12px 12px 0}
  .v2 .meta{justify-content:center;padding:6px 10px 12px}
  .v2 .name{text-align:center;width:100%}
  .v2 .qty{position:absolute;top:8px;right:8px;z-index:3;
    background:var(--qty-bg);color:var(--qty-fg);
    box-shadow:inset 0 0 0 1px var(--qty-ring);backdrop-filter:blur(6px)}
  .v2 .tile.counted .qty{background:var(--accent);color:var(--accent-fg);box-shadow:none}

  /* ============ 3 · full-bleed photo + gradient ============ */
  .v3 .count{grid-template-rows:1fr}
  .v3 .pic{grid-row:1;grid-column:1;padding:0}
  .v3 .pic img{object-fit:cover;transform:scale(1.3)}
  .v3 .meta{grid-row:1;grid-column:1;align-self:end;z-index:2;align-items:flex-end;
    padding:38px 12px 10px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.85))}
  .v3 .name{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65)}
  .v3 .qty{position:absolute;top:8px;right:8px;z-index:3;
    background:var(--qty-bg);color:var(--qty-fg);
    box-shadow:inset 0 0 0 1px var(--qty-ring);backdrop-filter:blur(6px)}
  .v3 .tile.counted .qty{background:var(--accent);color:var(--accent-fg);box-shadow:none}

  /* ============ 4 · soft raised card ============ */
  .v4 .tile{border:0;box-shadow:var(--shadow)}
  .v4 .pic{background:var(--surface-2);margin:8px 8px 0;border-radius:12px}
  .v4 .meta{padding:10px 12px 12px}
  .v4 .tile.counted{box-shadow:0 0 0 2px var(--accent),var(--shadow)}

  /* ============ 5 · quantity hero ============ */
  .v5 .meta{align-items:flex-end;padding:4px 12px 12px}
  .v5 .name{font-size:11px;color:var(--dim);padding-bottom:7px}
  .v5 .qty{font-size:30px;font-weight:900;line-height:1;letter-spacing:-1.5px;
    background:transparent;color:var(--fg);min-width:0;min-height:0;padding:0;border-radius:0}
  .v5 .tile.counted .qty{background:transparent;color:var(--accent)}

  /* ============ 6 · accent side rail ============ */
  .v6 .tile{border-left:5px solid var(--border)}
  .v6 .tile.counted{border-left-color:var(--accent)}
  .v6 .pic{padding:12px 12px 4px 15px}
  .v6 .meta{padding:6px 15px 12px}

  /* ============ 7 · compact list row ============ */
  .v7 .tile{aspect-ratio:2.4/1;border-radius:14px}
  .v7 .count{grid-template-columns:34% 1fr;grid-template-rows:1fr}
  .v7 .pic{grid-row:1;grid-column:1;padding:8px}
  .v7 .meta{grid-row:1;grid-column:2;flex-direction:column;align-items:flex-start;
    justify-content:center;gap:2px;padding:8px 12px 8px 0}
  .v7 .name{font-size:13px}
  .v7 .qty{background:transparent;font-size:20px;min-width:0;min-height:0;padding:0}
  .v7 .tile.counted .qty{background:transparent;color:var(--accent)}

  /* ============ 8 · check indicator + dim when counted ============ */
  .v8 .pic{padding:42px 12px 8px}
  .v8 .count::before{content:'';position:absolute;top:8px;left:8px;z-index:3;
    width:22px;height:22px;border-radius:50%;
    border:2px solid var(--border);background:var(--card)}
  .v8 .tile.counted .count::before{content:'✓';display:flex;align-items:center;justify-content:center;
    border-color:var(--accent);background:var(--accent);color:var(--accent-fg);
    font-size:12px;font-weight:900}
  .v8 .tile.counted .pic img{opacity:.45;filter:grayscale(.5)}

  /* ============ 9 · glass footer ============ */
  .v9 .count{grid-template-rows:1fr}
  .v9 .pic{grid-row:1;grid-column:1;padding:0}
  .v9 .pic img{object-fit:cover;transform:scale(1.15)}
  .v9 .meta{grid-row:1;grid-column:1;align-self:end;z-index:2;margin:8px;border-radius:12px;
    background:color-mix(in srgb,var(--card) 58%,transparent);backdrop-filter:blur(10px);
    box-shadow:inset 0 0 0 1px var(--qty-ring)}
  .v9 .qty{background:var(--qty-bg);color:var(--qty-fg);box-shadow:inset 0 0 0 1px var(--qty-ring)}
  .v9 .tile.counted .qty{background:var(--accent);color:var(--accent-fg);box-shadow:none}

  /* ============ 10 · minimal / chrome-less ============ */
  .v10 .tile{border:0;background:transparent;border-radius:0}
  .v10 .pic{padding:6px}
  .v10 .meta{padding:4px 6px 8px;border-top:1px solid var(--border)}
  .v10 .qty{background:transparent;color:var(--dim);font-size:16px;min-width:0;min-height:0;padding:0}
  .v10 .tile.counted .qty{background:transparent;color:var(--accent)}
  .v10 .menu{top:0;right:0}

  .code{
    display:block;margin-top:12px;padding:9px 11px;border-radius:10px;
    background:var(--bg);color:var(--dim);
    font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;
  }
  .code b{color:var(--fg);font-weight:700}
</style>
</head>
<body class="desktop">
<header>
  <h1>Item tile — redesign gallery</h1>
  <p>Each card is a different direction, shown with the real app markup, real product photos and both counted / uncounted states. Tap a tile to count it; tap <b>···</b> to toggle counted. Click a card to mark your pick, then tell me its number.</p>
  <div class="controls">
    <button id="themeBtn">Theme: dark</button>
    <span class="label">Preview</span>
    <button id="deskBtn" class="on">Desktop 4-col</button>
    <button id="phoneBtn">Phone 2-col</button>
    <span class="label">Counted state</span>
    <button id="mixBtn" class="on">Mixed</button>
    <button id="allBtn">All</button>
    <button id="noneBtn">None</button>
    <span class="pick" id="pickText"></span>
  </div>
</header>
<main id="list"></main>

<script>
'use strict';

const ITEMS = [
  { name:'Keg 20 L',      img:'images/keg20.webp',       qty:4,  counted:true  },
  { name:'Green crate',   img:'images/crateGrnF.webp',   qty:12, counted:false },
  { name:'Euro pallet',   img:'images/palEUR.webp',      qty:3,  counted:false },
  { name:'Tub crate',     img:'images/crateTub.webp',    qty:7,  counted:true  },
  { name:'Slim keg',      img:'images/keg20slim.webp',   qty:2,  counted:false },
  { name:'Blue crate',    img:'images/crateBluF.webp',   qty:9,  counted:false },
  { name:'Blue crate E',  img:'images/crateBluE.webp',   qty:5,  counted:false },
  { name:'Green crate E', img:'images/crateGrnE.webp',   qty:6,  counted:false }
];

const VARIANTS = [
  [1,'v1','Current baseline','Reference only: photo panel on top, name left + quantity pill right, hard border.','current: .pic / .meta row + .qty pill'],
  [2,'v2','Floating counter badge','Quantity floats over the photo as a translucent pill; the name gets the full footer width. Image is taller.','.qty{position:absolute;top:8px;right:8px}\n.meta{justify-content:center}'],
  [3,'v3','Full-bleed photo','Photo fills the whole tile, name sits on a bottom gradient, quantity is a glass badge top-right. Maximum image, still readable.','.pic img{object-fit:cover}\n.meta{grid-area:1/1;align-self:end;background:linear-gradient(transparent,#000d)}'],
  [4,'v4','Soft raised card','No hard border: subtle shadow, tinted rounded image panel. Feels lighter and more “app-like”. Counted state adds an accent ring.','.tile{border:0;box-shadow:var(--shadow)}\n.pic{background:var(--surface-2);margin:8px 8px 0;border-radius:12px}'],
  [5,'v5','Quantity hero','The number becomes the visual anchor (big, tight tracking); the name drops to a small muted caption. Best for quick counting.','.qty{font-size:30px;font-weight:900;background:transparent}\n.name{font-size:11px;color:var(--dim)}'],
  [6,'v6','Accent side rail','A thick left rail marks counted items in the accent colour; everything else stays calm. A quiet, scannable status cue.','.tile{border-left:5px solid var(--border)}\n.tile.counted{border-left-color:var(--accent)}'],
  [7,'v7','Compact list row','Horizontal tile: thumbnail left, name + big number right. Denser, better for long item lists.','.tile{aspect-ratio:2.4/1}\n.count{grid-template-columns:34% 1fr}'],
  [8,'v8','Check indicator','A check circle appears when counted and the photo dims to greyscale — strong, glanceable “done” signal.','.count::before{content:\'\';border:2px solid var(--border);border-radius:50%}\n.counted .count::before{content:\'✓\';background:var(--accent)}\n.counted .pic img{opacity:.45;filter:grayscale(.5)}'],
  [9,'v9','Glass footer','Photo fills the tile; a frosted glass bar holds the name and count. Modern and premium, keeps the photo intact.','.meta{background:color-mix(in srgb,var(--card) 58%,transparent);backdrop-filter:blur(10px);border-radius:12px}'],
  [10,'v10','Minimal / chrome-less','No card, no border — just the product, a hairline divider and small muted numbers. Airy and quiet.','.tile{border:0;background:transparent}\n.meta{border-top:1px solid var(--border)}\n.qty{background:transparent;color:var(--dim)}']
];

const list = document.getElementById('list');
let picked = null;

function tileHTML(item){
  return '<article class="tile' + (item.counted ? ' counted' : '') + '" data-qty="' + item.qty + '" data-counted="' + item.counted + '">' +
    '<button class="count" aria-label="' + item.name + ': +1">' +
      '<span class="pic"><img src="' + item.img + '" alt="" loading="lazy" draggable="false"></span>' +
      '<span class="meta"><span class="name">' + item.name + '</span><span class="qty">' + item.qty + '</span></span>' +
    '</button>' +
    '<button class="menu" aria-label="Options">···</button>' +
  '</article>';
}

for (const [n, cls, name, desc, code] of VARIANTS){
  const card = document.createElement('article');
  card.className = 'card ' + cls;
  card.dataset.n = n;
  card.dataset.name = name;

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = '<span class="num">' + n + '</span><h2></h2><span class="pick-badge">Picked</span>';
  head.querySelector('h2').textContent = name;

  const p = document.createElement('p');
  p.className = 'card-desc';
  p.textContent = desc;

  const stage = document.createElement('div');
  stage.className = 'stage';
  const inner = document.createElement('div');
  inner.className = 'stage-inner';
  inner.innerHTML = ITEMS.map(tileHTML).join('');
  stage.appendChild(inner);

  const codeEl = document.createElement('code');
  codeEl.className = 'code';
  codeEl.textContent = code;

  card.append(head, p, stage, codeEl);

  inner.addEventListener('click', event => {
    const menu = event.target.closest('.menu');
    const tile = event.target.closest('.tile');
    if (!tile) return;
    if (menu){
      tile.classList.toggle('counted');
      return;
    }
    if (event.target.closest('.count')){
      tile.dataset.qty = String(Number(tile.dataset.qty || 0) + 1);
      tile.classList.add('counted');
      tile.querySelector('.qty').textContent = tile.dataset.qty;
      tile.classList.remove('bump');
      requestAnimationFrame(() => tile.classList.add('bump'));
    }
  });

  card.addEventListener('click', () => {
    picked = n;
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c === card));
    document.getElementById('pickText').textContent = 'Picked: #' + n + ' — ' + name;
  });

  list.appendChild(card);
}

function applyCounted(mode){
  document.querySelectorAll('.tile').forEach(tile => {
    if (mode === 'mixed') tile.classList.toggle('counted', tile.dataset.counted === 'true');
    else tile.classList.toggle('counted', mode === 'all');
  });
}

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const light = document.documentElement.dataset.theme === 'light';
  document.documentElement.dataset.theme = light ? 'dark' : 'light';
  themeBtn.textContent = 'Theme: ' + (light ? 'dark' : 'light');
});

const deskBtn = document.getElementById('deskBtn');
const phoneBtn = document.getElementById('phoneBtn');
deskBtn.addEventListener('click', () => {
  document.body.classList.remove('phone'); document.body.classList.add('desktop');
  deskBtn.classList.add('on'); phoneBtn.classList.remove('on');
});
phoneBtn.addEventListener('click', () => {
  document.body.classList.remove('desktop'); document.body.classList.add('phone');
  phoneBtn.classList.add('on'); deskBtn.classList.remove('on');
});

const mixBtn = document.getElementById('mixBtn');
const allBtn = document.getElementById('allBtn');
const noneBtn = document.getElementById('noneBtn');
function setCounted(btn, mode){
  applyCounted(mode);
  [mixBtn, allBtn, noneBtn].forEach(b => b.classList.toggle('on', b === btn));
}
mixBtn.addEventListener('click', () => setCounted(mixBtn, 'mixed'));
allBtn.addEventListener('click', () => setCounted(allBtn, 'all'));
noneBtn.addEventListener('click', () => setCounted(noneBtn, 'none'));
</script>
</body>
</html>

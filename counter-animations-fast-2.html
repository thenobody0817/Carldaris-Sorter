<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter effects — 16 snap styles</title>
<style>
  :root{
    --bg:#111;
    --card:#1e1e1e;
    --surface-2:#2a2a2a;
    --fg:#eee;
    --dim:#888;
    --border:#333;
    --accent:#4ade80;
    --accent-fg:#000;
    --danger:#f87171;
    --qty-bg:rgba(0,0,0,.62);
    --qty-fg:#fff;
    --qty-ring:rgba(255,255,255,.22);
    --speed:1;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7;
    --card:#ffffff;
    --surface-2:#eceef1;
    --fg:#14171a;
    --dim:#5f6b76;
    --border:#d7dbe0;
    --accent:#16a34a;
    --accent-fg:#ffffff;
    --danger:#dc2626;
    --qty-bg:rgba(255,255,255,.92);
    --qty-fg:#14171a;
    --qty-ring:rgba(0,0,0,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:16px 16px 72px;
    font:15px/1.4 system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--fg);
  }
  header{max-width:1180px;margin:0 auto 18px}
  h1{font-size:20px;margin:0 0 4px}
  header p{margin:0 0 10px;color:var(--dim);font-size:13px;max-width:80ch}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .controls button{
    font:inherit;font-weight:700;padding:8px 12px;border-radius:10px;
    border:0;background:var(--surface-2);color:var(--fg);cursor:pointer;
  }
  .controls button.on{background:var(--accent);color:var(--accent-fg)}
  .controls label{font-size:12px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:6px}
  .controls input[type=range]{width:130px}
  main{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:12px;display:flex;flex-direction:column;gap:8px;
  }
  .card-name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.4px}
  .chip.ms{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .chip.instant{color:var(--fg);background:var(--surface-2)}
  .card-desc{color:var(--dim);font-size:12px;min-height:34px}
  .stage{
    display:flex;align-items:center;justify-content:center;
    padding:26px 0;background:var(--bg);border-radius:10px;
    overflow:visible;
  }
  .badge{
    --ad:calc(var(--dur,60ms) * var(--speed,1));
    min-width:58px;height:46px;padding:0 14px;border-radius:11px;
    background:var(--qty-bg);color:var(--qty-fg);
    box-shadow:inset 0 0 0 1px var(--qty-ring);
    font-weight:800;font-size:24px;line-height:1;
    font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    will-change:transform,opacity;
  }
  .badge .num{display:inline-flex;align-items:center;position:relative;z-index:1;will-change:transform,opacity}
  .badge .ghost{
    position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;will-change:transform,opacity;
  }
  .btns{display:flex;gap:6px}
  .btns button{
    flex:1;font:inherit;font-weight:700;padding:8px 0;border-radius:9px;
    border:0;background:var(--surface-2);color:var(--fg);cursor:pointer;
    touch-action:manipulation;
  }
  .btns .plus{background:var(--accent);color:var(--accent-fg)}
  .btns .rapid{flex:0 0 auto;padding:8px 10px;background:var(--surface-2);color:var(--dim)}

  /* ---------- shared slides (transform/opacity only) ---------- */
  @keyframes inLeft{from{transform:translateX(var(--travel,34%))}to{transform:translateX(0)}}
  @keyframes outLeft{from{transform:translateX(0)}to{transform:translateX(calc(var(--travel,34%) * -1))}}
  @keyframes inRight{from{transform:translateX(calc(var(--travel,34%) * -1))}to{transform:translateX(0)}}
  @keyframes outRight{from{transform:translateX(0)}to{transform:translateX(var(--travel,34%))}}
  @keyframes inUp{from{transform:translateY(var(--travel,40%))}to{transform:translateY(0)}}
  @keyframes outUp{from{transform:translateY(0)}to{transform:translateY(calc(var(--travel,40%) * -1))}}
  @keyframes inDown{from{transform:translateY(calc(var(--travel,40%) * -1))}to{transform:translateY(0)}}
  @keyframes outDown{from{transform:translateY(0)}to{transform:translateY(var(--travel,40%))}}
  @keyframes goutLeft{from{opacity:.85;transform:translateX(0)}to{opacity:0;transform:translateX(calc(var(--travel,58%) * -1))}}
  @keyframes goutUp{from{opacity:.85;transform:translateY(0)}to{opacity:0;transform:translateY(calc(var(--travel,58%) * -1))}}
  @keyframes wipeLeft{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes wipeUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes fadeLeft{from{opacity:0;transform:translateX(var(--travel,26%))}to{opacity:1;transform:translateX(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(var(--travel,26%))}to{opacity:1;transform:translateY(0)}}
  @keyframes gfade{from{opacity:.9}to{opacity:0}}

  .badge .num.in-left{animation-name:inLeft;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out)}
  .badge .num.in-right{animation-name:inRight;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out)}
  .badge .num.in-up{animation-name:inUp;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out)}
  .badge .num.in-down{animation-name:inDown;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out)}
  .badge .ghost.out-left{animation-name:outLeft;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out);animation-fill-mode:forwards}
  .badge .ghost.out-right{animation-name:outRight;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out);animation-fill-mode:forwards}
  .badge .ghost.out-up{animation-name:outUp;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out);animation-fill-mode:forwards}
  .badge .ghost.out-down{animation-name:outDown;animation-duration:var(--ad);animation-timing-function:var(--ease,ease-out);animation-fill-mode:forwards}
  .badge .ghost.gout-left{animation-name:goutLeft;animation-duration:var(--ad);animation-timing-function:ease-out;animation-fill-mode:forwards}
  .badge .ghost.gout-up{animation-name:goutUp;animation-duration:var(--ad);animation-timing-function:ease-out;animation-fill-mode:forwards}
  .badge .num.wipe-left{animation-name:wipeLeft;animation-duration:var(--ad);animation-timing-function:ease-out}
  .badge .num.wipe-up{animation-name:wipeUp;animation-duration:var(--ad);animation-timing-function:ease-out}
  .badge .num.fade-left{animation-name:fadeLeft;animation-duration:var(--ad);animation-timing-function:ease-out}
  .badge .num.fade-up{animation-name:fadeUp;animation-duration:var(--ad);animation-timing-function:ease-out}
  .badge .ghost.gfade{animation-name:gfade;animation-duration:var(--ad);animation-timing-function:ease-out;animation-fill-mode:forwards}

  /* ---------- per-variant timing ---------- */
  .v-snapleft{--dur:50ms;--travel:32%}
  .v-snapup{--dur:50ms;--travel:40%}
  .v-snapdir{--dur:50ms;--travel:32%}
  .v-streakleft{--dur:110ms;--travel:58%}
  .v-streakup{--dur:110ms;--travel:58%}
  .v-wipeleft{--dur:65ms}
  .v-wipeup{--dur:65ms}
  .v-halfleft{--dur:55ms;--travel:50%}
  .v-crossleft{--dur:75ms;--travel:26%}
  .v-crossup{--dur:75ms;--travel:26%}
  .v-slideflash{--dur:55ms;--travel:32%}
  .v-punch{--dur:45ms}
  .v-tick{--dur:40ms}
  .v-combo{--dur:55ms;--travel:32%}
  .v-flipfast{--dur:90ms}
  .v-digitsnap{--dur:50ms}

  /* ---------- 2 micro punch ---------- */
  @keyframes microPunch{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
  .v-punch .badge.up,.v-punch .badge.down{animation-name:microPunch;animation-duration:var(--ad);animation-timing-function:ease-out}

  /* ---------- 1 tick ---------- */
  @keyframes tickPunch{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
  .v-tick .badge.up,.v-tick .badge.down{animation-name:tickPunch;animation-duration:var(--ad);animation-timing-function:ease-out}

  /* ---------- colour flash ---------- */
  @keyframes colorUp{0%{color:var(--accent)}100%{color:var(--qty-fg)}}
  @keyframes colorDown{0%{color:var(--danger)}100%{color:var(--qty-fg)}}
  .v-slideflash .badge.flash-up{animation-name:colorUp;animation-duration:var(--ad);animation-timing-function:ease-out}
  .v-slideflash .badge.flash-down{animation-name:colorDown;animation-duration:var(--ad);animation-timing-function:ease-out}
  .v-combo .badge.up{animation-name:microPunch,colorUp;animation-duration:var(--ad),var(--ad);animation-timing-function:ease-out}
  .v-combo .badge.down{animation-name:microPunch,colorDown;animation-duration:var(--ad),var(--ad);animation-timing-function:ease-out}

  /* ---------- flip ---------- */
  @keyframes flipX{0%{transform:perspective(300px) rotateY(0)}50%{transform:perspective(300px) rotateY(90deg)}100%{transform:perspective(300px) rotateY(0)}}
  .v-flipfast .badge.flip-x{animation-name:flipX;animation-duration:var(--ad);animation-timing-function:ease}

  /* ---------- digit spin ---------- */
  .digit{display:inline-block;position:relative;overflow:hidden;height:1em;line-height:1;vertical-align:bottom}
  .digit.rolling .d-out,.digit.rolling .d-in{display:block}
  .digit.rolling .d-in{position:absolute;left:0;top:0}
  @keyframes dInUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes dOutUp{from{transform:translateY(0)}to{transform:translateY(-100%)}}
  @keyframes dInDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
  @keyframes dOutDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
  .digit.spin-up .d-out{animation:dOutUp var(--ad) ease-out}
  .digit.spin-up .d-in{animation:dInUp var(--ad) ease-out}
  .digit.spin-down .d-out{animation:dOutDown var(--ad) ease-out}
  .digit.spin-down .d-in{animation:dInDown var(--ad) ease-out}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<header>
  <h1>Counter effects — 16 snap styles</h1>
  <p>All of these update the <b>number first</b>, then add a fast motion cue, so the value is readable the instant you press. Every effect fires on <b>pointerdown</b>. Durations are 0&ndash;110ms. Drag the speed slider to compare, or hit <b>Stress</b> to see what survives rapid taps.</p>
  <div class="controls">
    <button id="autoBtn" class="on">Auto demo: on</button>
    <button id="themeBtn">Theme: dark</button>
    <button id="stressBtn">Stress 14/s: off</button>
    <button id="fireBtn">Fire all once</button>
    <button id="seedBtn">Seed 98</button>
    <button id="resetBtn">Reset to 5</button>
    <label>Speed <input id="speed" type="range" min="0.5" max="3" step="0.25" value="1"><span id="speedVal">1&times;</span></label>
  </div>
</header>
<main id="list"></main>

<script>
'use strict';

var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* kind: how the cue is applied. Value always updates instantly except where noted. */
var VARIANTS = [
  { id:'instant',   name:'1. Instant swap',    ms:0,   dur:0,   desc:'No animation. The honest baseline — nothing can be faster than this.' },
  { id:'tick',      name:'2. Tick',            ms:40,  dur:40,  desc:'Value swaps instantly, badge gives a 2% tick. Feels wired to your finger.' },
  { id:'snapleft',  name:'3. Snap left',       ms:50,  dur:50,  desc:'Your favourite, tightened: 32% travel instead of 65%, so the new number lands almost at once.' },
  { id:'snapup',    name:'4. Snap up',         ms:50,  dur:50,  desc:'Same snap, vertical. Short travel, ease-out.' },
  { id:'snapdir',   name:'5. Directional snap',ms:50,  dur:50,  desc:'+1 snaps left, \u22121 snaps right. Direction tells you which way the count went.' },
  { id:'streakleft',name:'6. Streak left',     ms:110, dur:110, desc:'The number is already the new value; only a faded ghost of the old one streaks out. Motion without delay.' },
  { id:'streakup',  name:'7. Streak up',       ms:110, dur:110, desc:'Same instant value swap, ghost drifts upward.' },
  { id:'wipeleft',  name:'8. Tape wipe left',  ms:65,  dur:65,  desc:'New number wipes in left-to-right over the old one, like a tape head passing. Value appears as it wipes.' },
  { id:'wipeup',    name:'9. Tape wipe up',    ms:65,  dur:65,  desc:'Vertical tape wipe.' },
  { id:'halfleft',  name:'10. Half slide',     ms:55,  dur:55,  desc:'Odometer with 50% travel: old and new share the space, settle fast.' },
  { id:'crossleft', name:'11. Crossfade left', ms:75,  dur:75,  desc:'Old fades out while the new fades and slides in. Soft, still quick.' },
  { id:'crossup',   name:'12. Crossfade up',   ms:75,  dur:75,  desc:'Vertical crossfade.' },
  { id:'digitsnap', name:'13. Digit snap',     ms:50,  dur:50,  desc:'Only digits that actually change flip over; carries roll the next column. Value is correct immediately.' },
  { id:'flipfast',  name:'14. Flip',           ms:90,  dur:90,  desc:'Fast 3D flip; number swaps at the 45ms midpoint.' },
  { id:'slideflash',name:'15. Slide + colour', ms:55,  dur:55,  desc:'Snap left plus an accent/danger colour flash. Two cues, one short beat.' },
  { id:'combo',     name:'16. Punch + colour', ms:55,  dur:55,  desc:'Instant value, 6% punch and a colour flash together. The all-rounder.' }
];

var list = document.getElementById('list');
var speed = 1;

VARIANTS.forEach(function (v) {
  var card = document.createElement('div');
  card.className = 'card v-' + v.id;
  card.dataset.variant = v.id;
  card.dataset.val = '5';
  card.dataset.dir = '1';
  card.dataset.dur = String(v.dur);
  card.innerHTML =
    '<div class="card-name"><span class="t"></span><span class="chip ms"></span><span class="chip instant">value instant</span></div>' +
    '<div class="card-desc"></div>' +
    '<div class="stage"><div class="badge"></div></div>' +
    '<div class="btns"><button class="minus">\u22121</button><button class="plus">+1</button><button class="rapid" title="Twelve taps in a row">\u00d712</button></div>';
  card.querySelector('.t').textContent = v.name;
  card.querySelector('.ms').textContent = v.ms + 'ms';
  card.querySelector('.card-desc').textContent = v.desc;
  list.appendChild(card);

  renderStatic(card, 5);

  bindPress(card.querySelector('.plus'), function () { trigger(card, 1); });
  bindPress(card.querySelector('.minus'), function () { trigger(card, -1); });
  bindPress(card.querySelector('.rapid'), function () { rapid(card, 1); });
  bindPress(card.querySelector('.badge'), function () { trigger(card, 1); });
});

function bindPress(el, fn) {
  el.addEventListener('pointerdown', fn);
  el.addEventListener('click', function (e) { if (e.detail === 0) fn(); });
}

function clearGhosts(badge) {
  badge.querySelectorAll('.ghost').forEach(function (g) { g.remove(); });
}

function renderStatic(card, value) {
  card.dataset.val = String(value);
  var badge = card.querySelector('.badge');
  clearGhosts(badge);
  badge.className = 'badge';
  var v = card.dataset.variant;
  if (v === 'digitsnap') {
    badge.innerHTML = '<span class="num">' + String(value).split('').map(function (c) { return '<span class="digit">' + c + '</span>'; }).join('') + '</span>';
  } else {
    badge.innerHTML = '<span class="num">' + value + '</span>';
  }
}

function setNum(card, value) { card.querySelector('.num').textContent = String(value); }

function durMs(card) { return (Number(card.dataset.dur) || 0) * speed; }

function addGhost(badge, text, behind) {
  var g = document.createElement('span');
  g.className = 'ghost';
  g.textContent = text;
  var num = badge.querySelector('.num');
  if (behind && num) badge.insertBefore(g, num);
  else badge.appendChild(g);
  return g;
}

function animate(badge, dir) {
  badge.classList.remove('up', 'down');
  void badge.offsetWidth;
  badge.classList.add(dir >= 0 ? 'up' : 'down');
  clearTimeout(badge._t);
  badge._t = setTimeout(function () { badge.classList.remove('up', 'down'); }, 260);
}

function trigger(card, dir) {
  var val = Number(card.dataset.val) || 0;
  var nv = Math.max(0, Math.min(999, val + dir));
  if (nv === val) return;
  card.dataset.val = String(nv);

  if (REDUCED) { renderStatic(card, nv); return; }

  var id = card.dataset.variant;
  var badge = card.querySelector('.badge');

  switch (id) {
    case 'instant':    setNum(card, nv); break;
    case 'tick':       setNum(card, nv); animate(badge, dir); break;
    case 'punch':      setNum(card, nv); animate(badge, dir); break;
    case 'combo':      setNum(card, nv); animate(badge, dir); break;
    case 'snapleft':   roll(card, dir, nv, 'left'); break;
    case 'snapup':     roll(card, dir, nv, 'up'); break;
    case 'snapdir':    roll(card, dir, nv, dir >= 0 ? 'left' : 'right'); break;
    case 'halfleft':   roll(card, dir, nv, 'left'); break;
    case 'streakleft': streak(card, nv, 'left'); break;
    case 'streakup':   streak(card, nv, 'up'); break;
    case 'wipeleft':   wipe(card, nv, 'left'); break;
    case 'wipeup':     wipe(card, nv, 'up'); break;
    case 'crossleft':  cross(card, nv, 'left'); break;
    case 'crossup':    cross(card, nv, 'up'); break;
    case 'slideflash': roll(card, dir, nv, 'left'); flash(badge, dir); break;
    case 'flipfast':   flip(card, nv); break;
    case 'digitsnap':  digitSpin(card, val, nv, dir); break;
  }
}

function roll(card, dir, nv, axis) {
  var badge = card.querySelector('.badge');
  var num = card.querySelector('.num');
  clearGhosts(badge);
  var ghost = addGhost(badge, num.textContent, false);
  num.textContent = String(nv);
  num.className = 'num';
  ghost.className = 'ghost';
  void num.offsetWidth;
  var inC, outC;
  if (axis === 'left') { inC = 'in-left'; outC = 'out-left'; }
  else if (axis === 'right') { inC = 'in-right'; outC = 'out-right'; }
  else if (axis === 'up') { inC = dir >= 0 ? 'in-up' : 'in-down'; outC = dir >= 0 ? 'out-up' : 'out-down'; }
  else { inC = dir >= 0 ? 'in-down' : 'in-up'; outC = dir >= 0 ? 'out-down' : 'out-up'; }
  num.classList.add(inC);
  ghost.classList.add(outC);
  setTimeout(function () { if (ghost.parentNode) ghost.remove(); }, durMs(card) + 60);
}

function streak(card, nv, axis) {
  var badge = card.querySelector('.badge');
  var num = card.querySelector('.num');
  clearGhosts(badge);
  var ghost = addGhost(badge, num.textContent, true);
  num.textContent = String(nv);
  void num.offsetWidth;
  ghost.classList.add(axis === 'up' ? 'gout-up' : 'gout-left');
  setTimeout(function () { if (ghost.parentNode) ghost.remove(); }, durMs(card) + 60);
}

function wipe(card, nv, axis) {
  var badge = card.querySelector('.badge');
  var num = card.querySelector('.num');
  clearGhosts(badge);
  var ghost = addGhost(badge, num.textContent, true);
  num.textContent = String(nv);
  num.className = 'num';
  void num.offsetWidth;
  num.classList.add(axis === 'up' ? 'wipe-up' : 'wipe-left');
  setTimeout(function () { if (ghost.parentNode) ghost.remove(); num.classList.remove('wipe-up', 'wipe-left'); }, durMs(card) + 60);
}

function cross(card, nv, axis) {
  var badge = card.querySelector('.badge');
  var num = card.querySelector('.num');
  clearGhosts(badge);
  var ghost = addGhost(badge, num.textContent, true);
  num.textContent = String(nv);
  num.className = 'num';
  ghost.className = 'ghost';
  void num.offsetWidth;
  num.classList.add(axis === 'up' ? 'fade-up' : 'fade-left');
  ghost.classList.add('gfade');
  setTimeout(function () { if (ghost.parentNode) ghost.remove(); num.classList.remove('fade-up', 'fade-left'); }, durMs(card) + 60);
}

function flash(badge, dir) {
  badge.classList.remove('flash-up', 'flash-down');
  void badge.offsetWidth;
  badge.classList.add(dir >= 0 ? 'flash-up' : 'flash-down');
  clearTimeout(badge._f);
  badge._f = setTimeout(function () { badge.classList.remove('flash-up', 'flash-down'); }, durMs(badge.closest('.card')) + 60);
}

function flip(card, nv) {
  var badge = card.querySelector('.badge');
  var token = (card._flip = (card._flip || 0) + 1);
  badge.classList.remove('flip-x');
  void badge.offsetWidth;
  badge.classList.add('flip-x');
  var d = durMs(card);
  setTimeout(function () { if (card._flip === token) setNum(card, nv); }, d * 0.5);
  setTimeout(function () { if (card._flip === token) badge.classList.remove('flip-x'); }, d + 40);
}

function digitSpin(card, val, nv, dir) {
  var num = card.querySelector('.num');
  var oldStr = String(val), newStr = String(nv);
  var len = Math.max(oldStr.length, newStr.length);
  var oldP = oldStr.padStart(len, ' ');
  var newP = newStr.padStart(len, ' ');
  num.innerHTML = newP.split('').map(function (ch, i) {
    var oc = oldP[i];
    if (oc !== ch && oc !== ' ' && ch !== ' ') {
      return '<span class="digit rolling"><span class="d-out">' + oc + '</span><span class="d-in">' + ch + '</span></span>';
    }
    return '<span class="digit">' + (ch === ' ' ? '' : ch) + '</span>';
  }).join('');
  var token = (card._dToken = (card._dToken || 0) + 1);
  requestAnimationFrame(function () {
    if (card._dToken !== token) return;
    num.querySelectorAll('.digit.rolling').forEach(function (d) {
      d.classList.remove('spin-up', 'spin-down');
      void d.offsetWidth;
      d.classList.add(dir >= 0 ? 'spin-up' : 'spin-down');
    });
  });
  clearTimeout(card._dClean);
  card._dClean = setTimeout(function () {
    if (card._dToken !== token) return;
    num.innerHTML = String(nv).split('').map(function (ch) { return '<span class="digit">' + ch + '</span>'; }).join('');
  }, durMs(card) + 60);
}

function rapid(card, dir) {
  var n = 0;
  var timer = setInterval(function () {
    trigger(card, dir);
    if (++n >= 12) clearInterval(timer);
  }, 40);
}

/* ---------- global controls ---------- */
var auto = true;
setInterval(function () {
  if (!auto) return;
  document.querySelectorAll('.card').forEach(function (card) {
    var val = Number(card.dataset.val);
    var dir = Number(card.dataset.dir) || 1;
    if (val >= 9) dir = -1;
    else if (val <= 0) dir = 1;
    card.dataset.dir = String(dir);
    trigger(card, dir);
  });
}, 800);

var autoBtn = document.getElementById('autoBtn');
autoBtn.addEventListener('click', function () {
  auto = !auto;
  autoBtn.classList.toggle('on', auto);
  autoBtn.textContent = 'Auto demo: ' + (auto ? 'on' : 'off');
});

var themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', function () {
  var light = document.documentElement.dataset.theme === 'light';
  document.documentElement.dataset.theme = light ? 'dark' : 'light';
  themeBtn.textContent = 'Theme: ' + (light ? 'dark' : 'light');
});

var speedInput = document.getElementById('speed');
var speedVal = document.getElementById('speedVal');
speedInput.addEventListener('input', function () {
  speed = Number(speedInput.value) || 1;
  document.documentElement.style.setProperty('--speed', speed);
  speedVal.textContent = speed + '\u00d7';
});

document.getElementById('fireBtn').addEventListener('click', function () {
  document.querySelectorAll('.card').forEach(function (card) { trigger(card, 1); });
});

var stress = null;
var stressBtn = document.getElementById('stressBtn');
stressBtn.addEventListener('click', function () {
  if (stress) { clearInterval(stress); stress = null; }
  else {
    auto = false; autoBtn.classList.remove('on'); autoBtn.textContent = 'Auto demo: off';
    stress = setInterval(function () {
      document.querySelectorAll('.card').forEach(function (card) {
        trigger(card, Math.random() < 0.5 ? 1 : -1);
      });
    }, 70);
  }
  stressBtn.classList.toggle('on', !!stress);
  stressBtn.textContent = 'Stress 14/s: ' + (stress ? 'on' : 'off');
});

document.getElementById('seedBtn').addEventListener('click', function () {
  document.querySelectorAll('.card').forEach(function (card) { renderStatic(card, 98); });
});
document.getElementById('resetBtn').addEventListener('click', function () {
  document.querySelectorAll('.card').forEach(function (card) { renderStatic(card, 5); });
});
</script>

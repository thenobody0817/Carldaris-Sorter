<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Count">
<title>Count</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script>
/* Apply the saved theme before styles render to avoid a flash. */
(function(){
  try{
    var pref = 'auto';
    var accent = 'green';
    var contrast = 'normal';
    var raw = localStorage.getItem('countlist.v3');
    if (raw){
      var s = JSON.parse(raw);
      if (s && s.theme) pref = s.theme;
      if (s && s.accent) accent = s.accent;
      if (s && s.contrast) contrast = s.contrast;
    }
    var light = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
    var eff = (pref === 'light' || pref === 'dark' || pref === 'oled') ? pref : (light ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', eff);
    document.documentElement.setAttribute('data-accent', accent);
    document.documentElement.setAttribute('data-contrast', contrast === 'high' ? 'high' : 'normal');
  }catch(e){}
})();
</script>

<script id="embeddedState" type="application/json">null</script>

<style>
  :root{
    /* surfaces */
    --bg:#111;
    --card:#1e1e1e;
    --surface:#222;
    --surface-2:#2a2a2a;
    --surface-3:#333;
    --surface-4:#3a3a3a;
    --sunken:#111;
    --sunken-2:#1a1a1a;
    --header-bg:#000c;
    --overlay:#000b;

    /* text */
    --fg:#eee;
    --dim:#888;
    --muted:#bbb;
    --add-fg:#666;
    --add-fg-active:#999;
    --placeholder:#555;

    /* lines & shadows */
    --border:#333;
    --border-strong:#444;
    --glow:#ffffff1f;
    --shadow:#000a;
    --shadow-strong:#000c;

    /* accents */
    --accent:#4ade80;
    --accent-fg:#000;
    --select:#9ca3af;
    --select-ring:#9ca3af55;

    /* tile counter badge (drawn over photos) */
    --qty-fg:#fff;
    --qty-bg:rgba(0,0,0,.62);
    --qty-ring:rgba(255,255,255,.22);
    --qty-zero-fg:#bbb;
    --qty-zero-bg:rgba(0,0,0,.5);

    /* danger / status */
    --danger:#f87171;
    --danger-bg:#3a1f1f;
    --danger-strong:#7f1d1d;
    --danger-soft:#fca5a5;
    --mic-pulse:#f8717188;
    --mic-pulse-end:#f8717100;
    --save-bg:#1e3a1e;
    --save-fg:#86efac;
  }
  html[data-theme="light"]{
    /* surfaces */
    --bg:#f4f5f7;
    --card:#ffffff;
    --surface:#ffffff;
    --surface-2:#eceef1;
    --surface-3:#e2e5e9;
    --surface-4:#d8dce1;
    --sunken:#ffffff;
    --sunken-2:#e0e4e9;
    --header-bg:#ffffffcc;
    --overlay:#00000055;

    /* text */
    --fg:#14171a;
    --dim:#4b5563;
    --muted:#2b333b;
    --add-fg:#7b8590;
    --add-fg-active:#3a434c;
    --placeholder:#6b7480;

    /* lines & shadows */
    --border:#d7dbe0;
    --border-strong:#c3c9d0;
    --glow:#0000001f;
    --shadow:#00000014;
    --shadow-strong:#00000022;

    /* accents */
    --accent:#16a34a;
    --accent-fg:#ffffff;
    --select:#6b7280;
    --select-ring:#6b728055;

    /* danger / status */
    --danger:#dc2626;
    --danger-bg:#fee2e2;
    --danger-strong:#fee2e2;
    --danger-soft:#b91c1c;
    --mic-pulse:#dc262688;
    --mic-pulse-end:#dc262600;
    --save-bg:#dcfce7;
    --save-fg:#15803d;

    /* tile counter badge (drawn over photos) */
    --qty-fg:#14171a;
    --qty-bg:rgba(255,255,255,.92);
    --qty-ring:rgba(0,0,0,.14);
    --qty-zero-fg:#5f6b76;
    --qty-zero-bg:rgba(255,255,255,.8);
  }
  /* OLED black — dark base with true-black surfaces */
  html[data-theme="oled"]{
    --bg:#000;
    --card:#0a0a0a;
    --surface:#111;
    --surface-2:#161616;
    --surface-3:#222;
    --surface-4:#2a2a2a;
    --sunken:#000;
    --sunken-2:#111;
    --header-bg:#000000cc;
    --border:#2a2a2a;
    --border-strong:#3a3a3a;
    --shadow:#000;
    --shadow-strong:#000;
  }
  /* High-contrast modifier — boosts text/border contrast on the active theme */
  html[data-contrast="high"]{
    --fg:#ffffff;
    --dim:#cfcfcf;
    --muted:#f0f0f0;
    --add-fg:#cfcfcf;
    --add-fg-active:#ffffff;
    --placeholder:#cfcfcf;
    --border:#666;
    --border-strong:#999;
    --glow:#ffffff55;
  }
  html[data-theme="light"][data-contrast="high"]{
    --fg:#000000;
    --dim:#3a434c;
    --muted:#14171a;
    --add-fg:#3a434c;
    --add-fg-active:#000000;
    --placeholder:#3a434c;
    --border:#8a939c;
    --border-strong:#5f6b76;
    --glow:#00000033;
  }
  /* accent presets — override --accent/--accent-fg per theme */
  :root[data-accent="green"]{  --accent:#4ade80; --accent-fg:#000; }
  :root[data-accent="blue"]{   --accent:#60a5fa; --accent-fg:#000; }
  :root[data-accent="violet"]{ --accent:#a78bfa; --accent-fg:#000; }
  :root[data-accent="pink"]{   --accent:#f472b6; --accent-fg:#000; }
  :root[data-accent="amber"]{  --accent:#fbbf24; --accent-fg:#000; }
  :root[data-accent="cyan"]{   --accent:#22d3ee; --accent-fg:#000; }
  html[data-theme="light"][data-accent="green"]{  --accent:#16a34a; --accent-fg:#fff; }
  html[data-theme="light"][data-accent="blue"]{   --accent:#2563eb; --accent-fg:#fff; }
  html[data-theme="light"][data-accent="violet"]{ --accent:#7c3aed; --accent-fg:#fff; }
  html[data-theme="light"][data-accent="pink"]{   --accent:#db2777; --accent-fg:#fff; }
  html[data-theme="light"][data-accent="amber"]{  --accent:#d97706; --accent-fg:#fff; }
  html[data-theme="light"][data-accent="cyan"]{   --accent:#0891b2; --accent-fg:#fff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{scrollbar-gutter:stable}
  body{
    font:16px/1.3 system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--fg);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    overscroll-behavior:none;
  }
  button{
    background:var(--surface-3);color:var(--fg);border:0;border-radius:12px;
    padding:12px 16px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;
    touch-action:manipulation;
    transition:transform .06s ease, background .12s;
  }
  button:active{transform:scale(.94)}
  button.accent{background:var(--accent);color:var(--accent-fg)}
  button.danger{background:var(--danger-bg);color:var(--danger)}

  header{
    position:sticky;top:0;z-index:5;
    background:var(--header-bg);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:6px;
    border-bottom:1px solid var(--border);
  }
  .hdr-top{display:flex;align-items:center;gap:8px}
  .label{
    flex:1;min-width:0;background:transparent;border:0;outline:none;
    color:var(--fg);font:700 18px/1.2 system-ui,sans-serif;
    padding:2px 0;border-bottom:2px solid transparent;
    transition:border-color .15s;
    text-overflow:ellipsis;
  }
  .label::placeholder{color:var(--placeholder);font-weight:600}
  .label:focus{border-bottom-color:var(--accent)}

  .hdr-bottom{
    height:var(--hdr-bottom-h, auto);
    overflow:hidden;
    transition:height .2s ease, opacity .16s ease;
  }
  .hdr-bottom-inner{
    display:flex;align-items:center;gap:6px;
    justify-content:space-between;flex-wrap:wrap;
  }
  body.hdr-collapsed .hdr-bottom{
    height:0;opacity:0;pointer-events:none;
  }
  .date{font-size:12px;color:var(--dim)}
  .hdr-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .total{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;margin-right:2px}
  .hdr-right button{padding:8px 10px;font-size:13px}
  .hdr-right button.save{background:var(--save-bg);color:var(--save-fg)}

  main{
    padding:10px;
    display:grid;gap:8px;
    grid-template-columns:repeat(4, 1fr);

    --name-fs: 13px;

    --qty-fs: 20px;
    --qty-pad-y: 4px;
    --qty-pad-x: 9px;
    --qty-min-w: 34px;
    --qty-radius: 10px;
  }
  main[data-tsize="sm"]{ --name-fs: 11px; }
  main[data-tsize="lg"]{ --name-fs: 15px; }
  main[data-qsize="sm"]{
    --qty-fs: 16px; --qty-pad-y: 3px; --qty-pad-x: 7px;
    --qty-min-w: 28px; --qty-radius: 8px;
  }
  main[data-qsize="lg"]{
    --qty-fs: 26px; --qty-pad-y: 5px; --qty-pad-x: 12px;
    --qty-min-w: 42px; --qty-radius: 12px;
  }

  main[data-cols="auto"]{
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:10px;
  }
  main[data-cols="2"]{ grid-template-columns:repeat(2, 1fr); }
  main[data-cols="3"]{ grid-template-columns:repeat(3, 1fr); }
  main[data-cols="4"]{ grid-template-columns:repeat(4, 1fr); }
  main[data-cols="5"]{ grid-template-columns:repeat(5, 1fr); gap:6px; }
  main[data-cols="6"]{ grid-template-columns:repeat(6, 1fr); gap:5px; }

  main[data-dir="rtl"]{ direction: rtl; }
  main[data-dir="rtl"] > *{ direction: ltr; }

  /* --- "rows visible" mode — fixed tile height --- */
  main[data-fit] .tile,
  main[data-fit] .add-tile{
    aspect-ratio: auto;
    height: var(--tile-h, 100px);
  }

  .cat-head{
    grid-column:1 / -1;
    display:flex;align-items:baseline;justify-content:flex-start;
    margin:14px 2px 2px;
  }
  .cat-head:first-child{margin-top:2px}
  .cat-head .cat-sum{
    font-size:13px;color:var(--fg);font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .cat-foot{
    grid-column:1 / -1;
    font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--dim);
    margin:6px 2px 0;
    text-align:left;
  }
  main[data-catalign="center"] .cat-head{ justify-content:center; }
  main[data-catalign="right"]  .cat-head{ justify-content:flex-end; }
  main[data-catalign="center"] .cat-foot{ text-align:center; }
  main[data-catalign="right"]  .cat-foot{ text-align:right; }
  main[data-cols="6"] .cat-foot{ font-size:11px; }
  main[data-fit] .cat-head{ margin:6px 2px 2px; }

  .tile{
    background:var(--card);border-radius:14px;overflow:hidden;
    position:relative;aspect-ratio:1;
    display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
    border:2px solid transparent;cursor:pointer;
    transition:transform .06s ease,
               border-color .2s ease,
               box-shadow .2s ease;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:pan-y;
  }
  .tile:active{transform:scale(.96)}
  .tile.counted{border-color:var(--accent)}
  .tile.selected{
    border-color:var(--select);
    box-shadow:0 0 0 3px var(--select-ring);
    z-index:1;
  }
  .tile img{flex:1 1 auto;min-height:0;width:100%;height:auto;object-fit:cover;pointer-events:none}

  .tile .name{
    order:-1;
    flex:0 0 auto;
    padding:4px 7px;
    font-size:var(--name-fs);
    font-weight:700;line-height:1.2;
    color:var(--fg);
    background:var(--card);
    border-bottom:1px solid var(--border);
    text-align:center;
    word-break:break-word;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    pointer-events:none;
    z-index:2;
  }

  .tile .qty{
    position:absolute;
    right:8px;
    bottom:8px;
    z-index:3;
    min-width:var(--qty-min-w);
    padding:var(--qty-pad-y) var(--qty-pad-x);
    max-width:calc(100% - 16px);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:var(--qty-fs);
    font-weight:800;
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--qty-fg);
    background:var(--qty-bg);
    box-shadow:inset 0 0 0 1px var(--qty-ring);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    border-radius:var(--qty-radius);
    pointer-events:none;
  }
  .tile .qty.zero{ color:var(--qty-zero-fg); background:var(--qty-zero-bg); }
  .tile.counted .qty{ color:var(--accent-fg); background:var(--accent); }

  .add-tile{
    background:transparent;
    border:2px dashed var(--border-strong);
    border-radius:14px;
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--add-fg);font-size:52px;font-weight:200;line-height:1;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;
    transition:transform .06s ease, background .12s, border-color .12s, color .12s;
  }
  .add-tile:active{
    transform:scale(.96);
    background:var(--sunken-2);border-color:var(--add-fg);color:var(--add-fg-active);
  }
  main[data-cols="5"] .add-tile,
  main[data-cols="6"] .add-tile{ font-size:34px; }

  /* --- reorder mode (drag tiles to rearrange) --- */
  body.reorder main .tile{
    cursor:grab;
    touch-action:none;
    box-shadow:inset 0 0 0 2px var(--glow);
  }
  body.reorder main .tile:active{ transform:none; }
  body.reorder main .tile.dragging{
    cursor:grabbing;
    z-index:10;
    opacity:.92;
    transform:scale(1.06);
    border-color:var(--accent);
    box-shadow:0 10px 26px var(--shadow-strong);
    transition:none;
  }
  #reorderBtn.active{ background:var(--accent); color:var(--accent-fg); }

  /* empty layout cells */
  .tile.gap{
    background:transparent;
    border:2px dashed transparent;
    box-shadow:none;
    pointer-events:none;
  }
  body.reorder main .tile.gap{
    border-color:var(--surface-4);
    box-shadow:none;
    pointer-events:auto;
    touch-action:auto;
  }

  #modal,#editor,#cats,#settings{
    position:fixed;inset:0;background:var(--overlay);z-index:20;
    display:none;align-items:flex-end;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  #modal.on,#editor.on,#cats.on,#settings.on{display:flex}
  #editor{z-index:30}
  #settings{z-index:30}

  /* settings: no dim/blur + short sheet so grid changes stay visible behind it */
  #settings{
    background:transparent;
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  #settings .sheet{
    max-height:56vh;
    box-shadow:0 -10px 40px var(--shadow-strong);
  }

  .sheet{
    background:var(--surface);width:100%;
    border-radius:22px 22px 0 0;
    padding:20px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    max-height:90vh;overflow:auto;
    animation:slideup .2s ease;
    transition:transform .15s ease, max-height .15s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0}}
  .sheet h2{margin:0 0 4px;font-size:19px}
  .sheet .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .sheet input[type=number]{
    width:100%;font-size:48px;font-weight:800;text-align:center;
    padding:8px;background:var(--sunken);color:var(--fg);
    border:2px solid var(--border-strong);border-radius:14px;
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .sheet input[type=number]::-webkit-outer-spin-button,
  .sheet input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1;padding:14px 0}
  .row.quick button{background:var(--surface-2);font-size:18px;padding:16px 0}
  .row.quick .add1{
    flex:2;font-size:26px;font-weight:800;
    background:var(--accent);color:var(--accent-fg);
  }

  .sheet-head{
    display:flex;align-items:flex-start;gap:10px;
    margin-bottom:10px;
  }
  .sheet-head .head-text{ flex:1;min-width:0; }
  .sheet-head h2{ margin:0 0 2px;font-size:19px; }
  .sheet-head .sub{ margin:0; }
  .sheet-close{
    flex:0 0 40px;height:40px;padding:0;
    background:var(--surface-2);color:var(--fg);
    border-radius:12px;font-size:22px;font-weight:400;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }

  /* tile quantity feedback (tap +1 / swipe -1) — odometer roll */
  @keyframes odoInUp{   0%{transform:translateY(100%)}  100%{transform:translateY(0)} }
  @keyframes odoOutUp{  0%{transform:translateY(0)}     100%{transform:translateY(-100%)} }
  @keyframes odoInDown{ 0%{transform:translateY(-100%)} 100%{transform:translateY(0)} }
  @keyframes odoOutDown{0%{transform:translateY(0)}     100%{transform:translateY(100%)} }
  .tile .qty .odo-num{ display:inline-block; }
  .tile .qty .odo-ghost{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .tile .qty.odo-up   .odo-num{   animation:odoInUp .24s ease; }
  .tile .qty.odo-up   .odo-ghost{ animation:odoOutUp .24s ease forwards; }
  .tile .qty.odo-down .odo-num{   animation:odoInDown .24s ease; }
  .tile .qty.odo-down .odo-ghost{ animation:odoOutDown .24s ease forwards; }

  /* settings */
  .opt-row{ display:flex;gap:6px;margin:8px 0 4px; }
  .opt-row button{
    flex:1;padding:14px 0;font-size:15px;font-weight:700;
    background:var(--surface-2);color:var(--fg);
    border:2px solid transparent;border-radius:12px;
  }
  .opt-row button[data-cols="auto"]{flex:1.6;font-size:13px}
  .opt-row button[data-dir]{font-size:13px}
  .opt-row#themeRow button, .opt-row#contrastRow button{font-size:13px}
  .opt-row button.active{
    background:var(--accent);color:var(--accent-fg);
    border-color:var(--accent);
  }
  .settings-block{margin-bottom:18px}
  .settings-block:last-child{margin-bottom:0}
  .settings-block .block-label{
    font-size:12px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.06em;font-weight:700;
    margin:0 0 6px;
  }
  .opt-row.accent-row{ flex-wrap:wrap; justify-content:center; gap:10px; }
  .opt-row.accent-row button{
    flex:0 0 40px;width:40px;height:40px;padding:0;
    border-radius:50%;border:3px solid transparent;
    background:var(--sw, var(--surface-2));
  }
  .opt-row.accent-row button[data-accentopt="green"]{  --sw:#4ade80; }
  .opt-row.accent-row button[data-accentopt="blue"]{   --sw:#60a5fa; }
  .opt-row.accent-row button[data-accentopt="violet"]{ --sw:#a78bfa; }
  .opt-row.accent-row button[data-accentopt="pink"]{   --sw:#f472b6; }
  .opt-row.accent-row button[data-accentopt="amber"]{  --sw:#fbbf24; }
  .opt-row.accent-row button[data-accentopt="cyan"]{   --sw:#22d3ee; }
  html[data-theme="light"] .opt-row.accent-row button[data-accentopt="green"]{  --sw:#16a34a; }
  html[data-theme="light"] .opt-row.accent-row button[data-accentopt="blue"]{   --sw:#2563eb; }
  html[data-theme="light"] .opt-row.accent-row button[data-accentopt="violet"]{ --sw:#7c3aed; }
  html[data-theme="light"] .opt-row.accent-row button[data-accentopt="pink"]{   --sw:#db2777; }
  html[data-theme="light"] .opt-row.accent-row button[data-accentopt="amber"]{  --sw:#d97706; }
  html[data-theme="light"] .opt-row.accent-row button[data-accentopt="cyan"]{   --sw:#0891b2; }
  .opt-row.accent-row button.active{
    background:var(--sw, var(--accent));
    border-color:var(--fg);
  }

  /* compact settings sheet */
  #settings .sheet{ padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #settings .sheet h2{ font-size:17px;margin-bottom:2px; }
  #settings .sheet .sub{ font-size:12px;margin-bottom:8px; }
  #settings .settings-block{ margin-bottom:10px; }
  #settings .block-label{ margin:0 0 4px;font-size:11px; }
  #settings .opt-row{ margin:0;gap:5px; }
  #settings .opt-row button{ padding:9px 0;font-size:13px;border-radius:10px; }
  #settings .opt-row#themeRow button,
  #settings .opt-row#contrastRow button,
  #settings .opt-row button[data-cols="auto"],
  #settings .opt-row button[data-dir]{ font-size:12px; }
  #settings .opt-row.accent-row{ gap:8px; }
  #settings .opt-row.accent-row button{
    flex:0 0 34px;width:34px;height:34px;padding:0;border-radius:50%;
  }
  #settings .row{ margin-top:8px; }
  #settings .settings-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:10px 12px;align-items:start;
  }
  #settings .settings-grid .settings-block{ margin-bottom:0; }
  #settings .settings-grid .settings-block.wide{ grid-column:1 / -1; }
  @media (max-width: 340px){
    #settings .settings-grid{ grid-template-columns:1fr; }
    #settings .settings-grid .settings-block.wide{ grid-column:auto; }
  }

  /* counter */
  .counter-row button{font-size:18px;font-weight:800}
  .counter-row .counter-minus{background:var(--surface-2);color:var(--danger)}
  .counter-row .counter-reset{background:var(--surface-2);color:var(--fg)}
  .counter-row .counter-plus{background:var(--accent);color:var(--accent-fg)}

  /* multiplier */
  .mult-block{margin-top:16px}
  .mult-row{display:flex;align-items:flex-end;gap:10px}
  .mult-row + .mult-row{margin-top:10px}
  .mult-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .mult-field label{
    font-size:12px;color:var(--dim);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;text-align:center;
  }
  .mult-x{
    font-size:26px;font-weight:300;color:var(--dim);
    padding-bottom:12px;flex-shrink:0;
  }
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper input{
    flex:1;min-width:0;width:100%;
    font-size:28px;font-weight:800;text-align:center;
    padding:8px 4px;background:var(--sunken);color:var(--fg);
    border:2px solid var(--border-strong);border-radius:12px;
    font-variant-numeric:tabular-nums;font-family:inherit;outline:none;
    -moz-appearance:textfield;transition:border-color .15s;
  }
  .stepper input:focus{border-color:var(--accent)}
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper button{
    flex:0 0 38px;height:38px;padding:0;
    font-size:20px;font-weight:700;line-height:1;
    background:var(--surface-2);color:var(--fg);border-radius:11px;
  }
  .stepper button:active{background:var(--surface-3)}
  .mult-total{
    display:flex;align-items:baseline;justify-content:center;
    gap:14px;margin:14px 0 4px;
    padding:14px;background:var(--sunken);border-radius:14px;
    border:2px solid var(--border);
  }
  .mult-total span{
    font-size:13px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  }
  .mult-total strong{
    font-size:36px;font-weight:800;color:var(--accent);
    font-variant-numeric:tabular-nums;line-height:1;
  }
  .mult-total strong.zero{color:var(--placeholder)}

  .ed-label{
    display:block;font-size:12px;color:var(--dim);
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    margin:14px 0 6px;
  }
  .ed-input{
    width:100%;background:var(--sunken);color:var(--fg);
    border:2px solid var(--border-strong);border-radius:12px;
    padding:12px 14px;font-size:17px;
    font-family:inherit;outline:none;
    transition:border-color .15s;
  }
  .ed-input:focus{border-color:var(--accent)}

  .cats-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .cat-row{
    display:flex;align-items:center;gap:8px;
    background:var(--surface-2);border-radius:12px;padding:10px 12px;
  }
  .cat-row-name{
    flex:1;font-size:15px;font-weight:600;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cat-row-count{
    font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums;
    background:var(--sunken-2);padding:3px 8px;border-radius:8px;
    flex-shrink:0;
  }
  .cat-row button{
    padding:8px 10px;font-size:14px;
    border-radius:9px;min-width:38px;flex-shrink:0;
  }
  .cats-add{
    width:100%;background:var(--surface-2);
    border:2px dashed var(--border-strong);color:var(--dim);
    padding:14px;font-size:15px;
    margin-bottom:4px;
  }
  .cats-add:active{background:var(--surface-3);color:var(--muted)}
  .cats-empty{
    color:var(--dim);font-size:14px;
    text-align:center;padding:20px 0;
  }

  #pick{
    position:fixed;inset:0;background:var(--overlay);z-index:40;
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  #pick.on{display:flex}
  .pick-sheet{
    background:var(--surface-2);border-radius:18px;
    padding:20px;max-width:400px;width:100%;
    box-shadow:0 20px 60px var(--shadow);
    animation:slideup .15s ease;
  }
  .pick-sheet h3{margin:0 0 8px;font-size:17px}
  .pick-msg{
    color:var(--muted);font-size:14px;line-height:1.45;
    margin-bottom:16px;white-space:pre-line;
  }
  .pick-btns{display:flex;flex-direction:column;gap:8px}
  .pick-btns button{width:100%;padding:14px;font-size:15px}

  .mic{
    background:var(--surface-2);
    padding:8px 12px;font-size:16px;
    transition:background .15s, color .15s, transform .06s;
  }
  .mic.on{
    background:var(--danger-strong);color:var(--danger-soft);
    animation:micpulse 1.4s infinite;
  }
  @keyframes micpulse{
    0%,100%{ box-shadow:0 0 0 0 var(--mic-pulse) }
    70%    { box-shadow:0 0 0 10px var(--mic-pulse-end) }
  }

  #voiceToast{
    position:fixed;left:50%;
    bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);
    background:#000e;color:#fff;
    padding:10px 18px;border-radius:14px;
    font-size:14px;font-weight:600;line-height:1.3;
    pointer-events:none;z-index:60;
    opacity:0;transition:opacity .18s, transform .18s;
    max-width:88vw;text-align:center;
    box-shadow:0 6px 24px #000a;
  }
  #voiceToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #voiceToast.warn{background:#7f1d1dee;color:#fecaca}
  #voiceToast.ok  {background:#14532dee;color:#bbf7d0}
</style>
</head>
<body>

<header>
  <div class="hdr-top">

           placeholder="Untitled" maxlength="80"

  </div>

        <button id="reorderBtn" onclick="toggleReorder()" title="Rearrange tiles" data-i18n-title="reorder.title">↕</button>
        <button onclick="openSettings()" title="Settings" data-i18n-title="settings.title">⚙</button>
        <button onclick="openCats()" data-i18n="categories.title">Categories</button>
        <button onclick="exportCSV()" data-i18n="csv">CSV</button>
        <button onclick="resetAll()" data-i18n="reset">Reset</button>
        <button class="save" onclick="saveToFile()" data-i18n="save">💾 Save</button>
      </div>
    </div>
  </div>
</header>

<main id="grid" data-cols="4" data-dir="ltr" data-tsize="md" data-qsize="md"></main>

<div id="modal">

    <div class="sheet-head">
      <div class="head-text">
        <h2 id="mName"></h2>
        <div class="sub" id="mCat"></div>
      </div>
      <button class="sheet-close" onclick="closeModal()" aria-label="Close" data-i18n-aria="close">✕</button>
    </div>

    <input id="mInput" type="number" inputmode="numeric" step="1" value="0"
           oninput="commitLive()">

    <div class="row counter-row">
      <button class="counter-minus" onclick="bump(-1)">−1</button>
      <button class="counter-reset" onclick="setZero()" data-i18n="counter.reset">Reset</button>
      <button class="counter-plus" onclick="bump(1)">+1</button>
    </div>

    <div class="mult-block">
      <div class="mult-row">
        <div class="mult-field">
          <label for="multPerRow" data-i18n="calc.cols">Per row</label>
          <div class="stepper">
            <button type="button" onclick="multDelta('perRow', -1)" aria-label="−">−</button>
            <input id="multPerRow" type="number" inputmode="numeric" min="1" max="999" value="8">
            <button type="button" onclick="multDelta('perRow', 1)" aria-label="+">+</button>
          </div>
        </div>
        <div class="mult-x">×</div>
        <div class="mult-field">
          <label for="multRows" data-i18n="calc.rows">Rows</label>
          <div class="stepper">
            <button type="button" onclick="multDelta('rows', -1)" aria-label="−">−</button>
            <input id="multRows" type="number" inputmode="numeric" min="1" max="999" value="9">
            <button type="button" onclick="multDelta('rows', 1)" aria-label="+">+</button>
          </div>
        </div>
      </div>

      <div class="mult-row">
        <div class="mult-field">
          <label for="multEach" data-i18n="calc.each">Items per box</label>
          <div class="stepper">
            <button type="button" onclick="multDelta('each', -1)" aria-label="−">−</button>
            <input id="multEach" type="number" inputmode="numeric" min="1" max="9999" value="1">
            <button type="button" onclick="multDelta('each', 1)" aria-label="+">+</button>
          </div>
        </div>
      </div>

      <div class="mult-total">
        <span data-i18n="calc.total">Total</span>
        <strong id="multTotal" class="zero">0</strong>
      </div>

      <div class="row">
        <button onclick="multCommit(-1)" data-i18n="calc.subtract">− Subtract</button>
        <button class="accent" onclick="multCommit(1)" data-i18n="calc.add">+ Add</button>
      </div>
    </div>
  </div>
</div>

<div id="settings">
  <div class="sheet">
    <h2 data-i18n="settings.title">Settings</h2>
    <div class="sub" data-i18n="settings.tileView">Tile view</div>

    <div class="settings-grid">
    <div class="settings-block wide">
      <div class="block-label" data-i18n="settings.language">Language</div>
      <div class="opt-row" id="langRow">
        <button data-lang="ru" onclick="setLang('ru')">Рус</button>
        <button data-lang="en" onclick="setLang('en')">Eng</button>

        <button data-lang="zh" onclick="setLang('zh')">中文</button>
      </div>
    </div>

    <div class="settings-block wide">
      <div class="block-label" data-i18n="settings.cols">Tiles per row (columns)</div>

        <button data-cols="4" onclick="setGridCols('4')">4</button>

        <button data-rowfit="4" onclick="setRowFit('4')">4</button>
        <button data-rowfit="5" onclick="setRowFit('5')">5</button>
        <button data-rowfit="6" onclick="setRowFit('6')">6</button>

    <div class="settings-block">

function detectLang(){
  const n = (navigator.language || 'ru').toLowerCase();
  if (n.startsWith('en')) return 'en';
  if (n.startsWith('lv')) return 'lv';
  if (n.startsWith('zh')) return 'zh';
  return 'ru';
}

function curLang(){
  return LANGS[state && state.lang] ? state.lang : 'ru';
}

function t(key, vars){
  const dict = I18N[curLang()] || I18N.ru;
  let s = dict[key];
  if (s === undefined) s = I18N.ru[key];
  if (s === undefined) s = key;
  if (vars){
    for (const k in vars){
      s = s.split('{' + k + '}').join(vars[k]);
    }
  }
  return s;
}

function curLocale(){ return (LANGS[curLang()] || LANGS.ru).locale; }
function nf(n){ return Number(n).toLocaleString(curLocale()); }

function pluralKey(n){
  const l = curLang();
  if (l === 'ru'){
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'one';
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'few';
    return 'many';
  }
  if (l === 'lv'){
    return (n % 10 === 1 && n % 100 !== 11) ? 'one' : 'many';
  }
  if (l === 'en'){
    return n === 1 ? 'one' : 'many';
  }
  return 'many';
}

function pluralItems(n){ return t('items.' + pluralKey(n)); }

function defaultItemsFor(lang){
  const list = DEFAULT_ITEMS[lang] || DEFAULT_ITEMS.ru;
  return list.map(d => ({

    image: IMAGE_BY_ID[d.id] || '', qty: 0, counted: false

/* ================= state ================= */
function readEmbedded(){
  try{
    const el = document.getElementById('embeddedState');
    if (!el) return null;
    const text = (el.textContent || '').trim();
    if (!text || text === 'null') return null;
    return JSON.parse(text);
  }catch(e){ console.warn('embedded state is corrupted', e); return null; }
}

function readLocal(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  }catch{ return null; }
}

function load(){
  const emb = readEmbedded();
  const loc = readLocal();

  let chosen = null;
  if (emb && loc){
    const e = emb.savedAt || 0;
    const l = loc.savedAt || 0;
    chosen = l > e ? loc : emb;
  } else {
    chosen = emb || loc;
  }

  if (!chosen || !Array.isArray(chosen.items)) return seed();

  if (!Array.isArray(chosen.categories)){
    const seen = new Set();
    chosen.categories = [];
    for (const it of chosen.items){
      const c = it.category || '';
      if (c && !seen.has(c)){ seen.add(c); chosen.categories.push(c); }
    }
  }
  const set = new Set(chosen.categories);
  for (const it of chosen.items){
    const c = it.category || '';
    if (c && !set.has(c)){ chosen.categories.push(c); set.add(c); }
  }
  if (!chosen.gridCols) chosen.gridCols = '4';
  if (!chosen.gridDir)  chosen.gridDir  = 'ltr';
  if (!chosen.textSize) chosen.textSize = 'md';
  if (!chosen.qtySize)  chosen.qtySize  = 'md';
  if (!chosen.rowFit)   chosen.rowFit   = 'auto';
  if (!chosen.theme)    chosen.theme    = 'auto';
  if (!chosen.accent)   chosen.accent   = 'green';
  if (!chosen.contrast) chosen.contrast = 'normal';
  if (!chosen.catAlign) chosen.catAlign = 'left';
  if (!LANGS[chosen.lang]) chosen.lang  = 'ru';

  /* one-time: give older saved states the hosted images for default items */
  if (!chosen.imgV1){
    for (const it of chosen.items){
      if (!it.image && IMAGE_BY_ID[it.id]) it.image = IMAGE_BY_ID[it.id];
    }
    chosen.imgV1 = 1;
  }

  /* one-time: add default items introduced after this state was created */
  if (!chosen.newDefaultsV1){
    if (!chosen.items.some(i => i.id === 'crateGrnGarage')){
      const d = (DEFAULT_ITEMS[chosen.lang] || DEFAULT_ITEMS.ru).find(x => x.id === 'crateGrnGarage');
      if (d){
        const item = {id:d.id, name:d.name, category:d.category,
                      image: IMAGE_BY_ID[d.id] || '', qty:0, counted:false};
        const idx = chosen.items.findIndex(i => i.id === 'crateTub');
        if (idx >= 0) chosen.items.splice(idx + 1, 0, item);
        else chosen.items.push(item);
        if (d.category && !chosen.categories.includes(d.category)) chosen.categories.push(d.category);
      }
    }
    chosen.newDefaultsV1 = 1;
  }

  /* one-time: order the bottle crates so their colors line up on screen */
  if (!chosen.crateOrderV1){
    const order = ['crateBluF','crateTub','crateGrnF','crateGrnGarage'];
    const slots = [];
    chosen.items.forEach((it, i) => { if (order.indexOf(it.id) >= 0) slots.push(i); });
    const picked = slots.map(i => chosen.items[i])
      .sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    slots.forEach((i, k) => { chosen.items[i] = picked[k]; });
    chosen.crateOrderV1 = 1;
  }
  return chosen;
}

function seed(){
  const items = defaultItemsFor(detectLang());
  const seen = new Set();
  const categories = [];
  for (const it of items){
    const c = it.category || '';
    if (c && !seen.has(c)){ seen.add(c); categories.push(c); }
  }
  return {
    date: new Date().toISOString().slice(0,10),
    label: '',
    categories,
    items,
    lastItem: null,
    gridCols: '4',
    gridDir: 'ltr',
    textSize: 'md',
    qtySize: 'md',
    rowFit: 'auto',
    theme: 'auto',
    accent: 'green',
    contrast: 'normal',
    catAlign: 'left',
    lang: detectLang(),
    savedAt: 0
  };
}

/* ================= theme ================= */
function effectiveTheme(){
  const pref = state.theme || 'auto';
  if (pref === 'light' || pref === 'dark' || pref === 'oled') return pref;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)
    ? 'light' : 'dark';
}

function applyTheme(){
  const eff = effectiveTheme();
  document.documentElement.setAttribute('data-theme', eff);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', eff === 'light' ? '#f4f5f7' : (eff === 'oled' ? '#000000' : '#111111'));
  const apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (apple) apple.setAttribute('content', eff === 'light' ? 'default' : 'black-translucent');
}

function setTheme(v){
  if (v !== 'auto' && v !== 'light' && v !== 'dark' && v !== 'oled') return;
  state.theme = v;
  save();
  applyTheme();
  renderOpts();
}

function watchSystemTheme(){
  if (!window.matchMedia) return;

  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

/* Re-localizes built-in items/categories when the language changes (user items untouched). */
function localizeDefaults(lang){
  const target = DEFAULT_ITEMS[lang] || DEFAULT_ITEMS.ru;
  const byId = new Map(target.map(d => [d.id, d]));

  const catMap = new Map();
  for (const l in DEFAULT_ITEMS){
    for (const d of DEFAULT_ITEMS[l]){
      const tgt = byId.get(d.id);
      if (tgt && d.category) catMap.set(d.category, tgt.category);
    }
  }

  for (const it of state.items){
    const d = byId.get(it.id);
    if (d){ it.name = d.name; it.category = d.category; }
  }

  const seen = new Set();
  const cats = [];
  for (const c of state.categories){
    const nc = catMap.get(c) || c;
    if (!seen.has(nc)){ seen.add(nc); cats.push(nc); }
  }
  state.categories = cats;
}

  state.lang = v;

/* Computes the tile height so exactly N rows fit in the visible area. */
function fitTiles(){
  const main = document.getElementById('grid');
  if (!main) return;

  const fitRaw = state.rowFit || 'auto';
  if (fitRaw === 'auto'){
    main.removeAttribute('data-fit');
    main.style.removeProperty('--tile-h');
    return;
  }

  const fit = Math.max(1, Math.min(12, parseInt(fitRaw, 10) || 4));
  main.setAttribute('data-fit', String(fit));

  const vh = (window.visualViewport && window.visualViewport.height)
             || window.innerHeight || 800;

  const headerEl = document.querySelector('header');
  let headerH = (headerEl && headerEl.offsetHeight) || 90;
  if (headerEl && document.body.classList.contains('hdr-collapsed')){
    const inner = headerEl.querySelector('.hdr-bottom-inner');
    if (inner) headerH += inner.scrollHeight;
  }

  /* body bottom padding — safe-area breathing room */
  const bodyPB = parseFloat(getComputedStyle(document.body).paddingBottom) || 24;

  /* count how many category headers will actually be rendered */
  let visibleCats = 0;
  for (const cat of (state.categories || [])){
    if (state.items.some(i => i.category === cat && !i.spacer)) visibleCats++;
  }

  const catHeaderH = 48;
  const mainPad = 20;
  const gap = 8;

  const available =
    vh - headerH - bodyPB - mainPad -
    (visibleCats * catHeaderH) -
    ((fit - 1) * gap);

  const tileH = Math.max(48, Math.floor(available / fit));
  main.style.setProperty('--tile-h', tileH + 'px');
}

window.addEventListener('resize', () => requestAnimationFrame(() => { measureHeader(); fitTiles(); }));
window.addEventListener('orientationchange', () => setTimeout(fitTiles, 200));
if (window.visualViewport){
  visualViewport.addEventListener('resize', () => requestAnimationFrame(fitTiles));
}

/* ================= collapse header on scroll ================= */
const HEADER_OVERLAYS = ['modal','editor','cats','settings','pick'];
function anyOverlayOpen(){
  for (const id of HEADER_OVERLAYS){
    const el = document.getElementById(id);
    if (el && el.classList.contains('on')) return true;
  }
  return false;
}

/* Measure the natural height of the button row so it can animate from a
   concrete pixel value to 0 (auto height cannot be transitioned). */
function measureHeader(){
  const wrap  = document.querySelector('.hdr-bottom');
  const inner = document.querySelector('.hdr-bottom-inner');
  if (!wrap || !inner) return;
  const h = Math.ceil(inner.getBoundingClientRect().height) + 1;
  if (h > 1) wrap.style.setProperty('--hdr-bottom-h', h + 'px');
}

let lastScrollY = window.scrollY || 0;
let scrollTicking = false;
let collapseLockUntil = 0;

function setHeaderCollapsed(v){
  if (document.body.classList.contains('hdr-collapsed') === v) return;
  document.body.classList.toggle('hdr-collapsed', v);
  /* ignore further direction changes until the height animation settles */
  collapseLockUntil = Date.now() + 260;
}

function updateHeaderCollapse(){
  const y = window.scrollY || document.documentElement.scrollTop || 0;

  if (y <= 8 || anyOverlayOpen()){
    setHeaderCollapsed(false);
  } else if (Date.now() >= collapseLockUntil){
    if (y > lastScrollY + 6)      setHeaderCollapsed(true);
    else if (y < lastScrollY - 6) setHeaderCollapsed(false);
  }
  lastScrollY = y;
}

window.addEventListener('scroll', () => {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => { updateHeaderCollapse(); scrollTicking = false; });
}, {passive:true});

/* ================= saving to file ================= */
async function saveToFile(){
  let html;
  try{ html = buildUpdatedHtml(); }
  catch(e){
    console.error(e);
    alert(t('save.failMsg', {msg: e.message}));
    return;
  }

  const filename = suggestedFilename();

  if (typeof window.showSaveFilePicker === 'function'){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description:'HTML', accept:{'text/html':['.html']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(html);
      await writable.close();
      await showPick({
        title: t('save.savedTitle'),
        message: t('save.savedMsg'),
        options: [{label:t('save.understood'), value:null}]
      });
      return;
    }catch(e){
      if (e && e.name === 'AbortError') return;
      console.warn('showSaveFilePicker failed, falling back to download', e);
    }
  }

  downloadHtml(html, filename);

  await showPick({
    title: t('save.downloadTitle'),
    message: t('save.downloadMsg', {filename}),
    options: [{label:t('save.understood'), value:null}]
  });
}

function downloadHtml(html, filename){
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function suggestedFilename(){
  return `${slug(state.label || t('slug.default'))}-${state.date}.html`;
}

function buildUpdatedHtml(){
  const clone = document.documentElement.cloneNode(true);

  ['#grid','#catsList','#catList','#pickBtns'].forEach(sel => {
    const el = clone.querySelector(sel);
    if (el) el.innerHTML = '';
  });
  const mainClone = clone.querySelector('#grid');
  if (mainClone){
    mainClone.setAttribute('data-cols',  state.gridCols || '4');
    mainClone.setAttribute('data-dir',   state.gridDir  || 'ltr');
    mainClone.setAttribute('data-tsize', state.textSize || 'md');
    mainClone.setAttribute('data-qsize', state.qtySize  || 'md');
    mainClone.setAttribute('data-catalign', state.catAlign || 'left');
    if (state.rowFit && state.rowFit !== 'auto'){
      mainClone.setAttribute('data-fit', state.rowFit);
    } else {
      mainClone.removeAttribute('data-fit');
    }
    /* the computed tile height is not saved — it is recalculated on load */
    mainClone.removeAttribute('style');
  }

  ['#modal','#editor','#cats','#pick','#settings'].forEach(sel => {
    const el = clone.querySelector(sel);
    if (el) el.classList.remove('on');
  });
  const bodyClone = clone.querySelector('body');
  if (bodyClone) bodyClone.classList.remove('hdr-collapsed');

  ['#mName','#mCat','#pickTitle','#pickMsg',
   '#edTitle','#edSub','#total','#date','#voiceToast'].forEach(sel => {
    const el = clone.querySelector(sel);
    if (el) el.textContent = '';
  });

  ['#edName','#edCat','#label'].forEach(sel => {
    const el = clone.querySelector(sel);
    if (el) el.value = '';
  });
  const mInput = clone.querySelector('#mInput');
  if (mInput) mInput.value = '0';

  const multPerRowEl = clone.querySelector('#multPerRow');
  if (multPerRowEl) multPerRowEl.value = '8';
  const multRowsEl = clone.querySelector('#multRows');
  if (multRowsEl) multRowsEl.value = '9';
  const multEachEl = clone.querySelector('#multEach');
  if (multEachEl) multEachEl.value = '1';
  const multTotalEl = clone.querySelector('#multTotal');
  if (multTotalEl){ multTotalEl.textContent = '0'; multTotalEl.className = 'zero'; }

  const micBtn = clone.querySelector('#micBtn');
  if (micBtn) micBtn.classList.remove('on');

  const toast = clone.querySelector('#voiceToast');
  if (toast) toast.className = '';

  clone.querySelectorAll('#settings .opt-row button')
    .forEach(b => b.classList.remove('active'));

  clone.querySelectorAll('.sheet').forEach(s => {
    s.style.transform = '';
    s.style.maxHeight = '';
  });

  let es = clone.querySelector('#embeddedState');
  if (!es){
    es = document.createElement('script');
    es.id = 'embeddedState';
    es.type = 'application/json';
    const head = clone.querySelector('head');
    if (head) head.appendChild(es);
    else clone.appendChild(es);
  }
  es.textContent = safeJson(state);

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

function safeJson(obj){
  return JSON.stringify(obj).replace(/</g, '\\u003c');
}

/* ================= resetting counters ================= */
async function resetAll(){
  const ok = await showPick({
    title: t('reset.title'),
    message: t('reset.msg'),
    options: [
      {label:t('reset.confirm'), value:'yes', style:'danger'},
      {label:t('cancel'), value:null}
    ]
  });
  if (ok !== 'yes') return;

  state.label = '';
  document.getElementById('label').value = '';
  for (const it of state.items){
    it.qty = 0;
    it.counted = false;
  }

  qbId = null;
  activeId = null;
  state.lastItem = null;
  document.getElementById('modal').classList.remove('on');
  document.getElementById('settings').classList.remove('on');
  document.getElementById('editor').classList.remove('on');
  document.getElementById('cats').classList.remove('on');
  save();
  render();
  requestAnimationFrame(fitTiles);
}

/* ================= rendering ================= */
function render(){
  document.getElementById('date').textContent =
    new Date(state.date + 'T00:00').toLocaleDateString(curLocale(),
      {day:'numeric', month:'long', year:'numeric'});
  document.getElementById('label').value = state.label || '';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let total = 0;

  const uncat = state.items.filter(i => !i.category);
  while (uncat.length && uncat[uncat.length - 1].spacer) uncat.pop();
  for (const it of uncat){
    if (it.spacer){ grid.appendChild(makeGap(it)); continue; }
    total += it.qty;
    grid.appendChild(makeTile(it));
  }

  for (const cat of state.categories){
    const list = state.items.filter(i => i.category === cat);
    while (list.length && list[list.length - 1].spacer) list.pop();
    if (!list.some(i => !i.spacer)) continue;

    const catSum = list.reduce((s, it) => s + (it.spacer ? 0 : it.qty), 0);
    const hdr = document.createElement('div');
    hdr.className = 'cat-head';
    hdr.innerHTML = `<span class="cat-sum">${nf(catSum)}</span>`;
    grid.appendChild(hdr);

    for (const it of list){
      if (it.spacer){ grid.appendChild(makeGap(it)); continue; }
      total += it.qty;
      grid.appendChild(makeTile(it));
    }

    const foot = document.createElement('div');
    foot.className = 'cat-foot';
    foot.textContent = cat;
    grid.appendChild(foot);
  }

  const addTile = document.createElement('div');
  addTile.className = 'add-tile';
  addTile.textContent = '+';
  addTile.title = t('addTile.title');
  addTile.onclick = () => openEditor(null, 'item');
  grid.appendChild(addTile);

  document.getElementById('total').textContent = nf(total);
}

function makeTile(it){
  const el = document.createElement('div');
  el.className = 'tile'
    + (it.qty > 0 ? ' counted' : '')
    + (it.id === qbId ? ' selected' : '');
  el.dataset.id = it.id;
  el.dataset.cat = it.category || '';
  el.innerHTML = `
    ${it.image ? `<img src="${it.image}" alt="">` : ''}
    <div class="name">${escapeHtml(it.name)}</div>
    <div class="qty ${it.qty ? '' : 'zero'}">${it.qty}</div>`;
  return el;
}

function makeGap(it){
  const el = document.createElement('div');
  el.className = 'tile gap';
  el.dataset.id = it.id;
  el.dataset.cat = it.category || '';
  return el;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ================= tap / swipe / long-press ================= */
const gridEl = document.getElementById('grid');
let pressTimer  = null;
let pressTarget = null;
let longPressed = false;
let moved       = false;
let swiped      = false;
let startX = 0, startY = 0;
let swipeNeed = 44;

gridEl.addEventListener('pointerdown', e => {
  const tile = e.target.closest('.tile');
  if (reorderMode){
    if (tile) startDrag(e, tile);
    return;
  }
  if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  if (!tile) return;

  longPressed = false;
  moved       = false;
  swiped      = false;
  startX = e.clientX;
  startY = e.clientY;
  pressTarget = tile;
  swipeNeed = Math.max(30, tile.getBoundingClientRect().width * 0.55);
  pressTimer = setTimeout(() => {
    longPressed = true;
    openModal(tile.dataset.id);
    navigator.vibrate?.(15);
  }, 500);
});

document.addEventListener('pointermove', e => {
  if (dragState){ moveDrag(e); return; }
  if (!pressTarget) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  if (!moved && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
    moved = true;
    clearTimeout(pressTimer);
    pressTimer = null;
  }
  /* mostly-horizontal drag past the threshold = -1 */
  if (!swiped && !longPressed && Math.abs(dx) > swipeNeed && Math.abs(dx) > Math.abs(dy) * 1.5){
    swiped = true;
    swipeDecrement(pressTarget.dataset.id);
  }
});

document.addEventListener('pointerup', e => {
  if (dragState){ endDrag(e); return; }
  const wasPressing = pressTimer !== null;
  clearTimeout(pressTimer);
  pressTimer = null;
  const target = pressTarget;
  pressTarget = null;

  if (wasPressing && !longPressed && !moved && !swiped && target){
    tapTile(target.dataset.id);
  } else if (swiped){
    render();
  }
});

document.addEventListener('pointercancel', e => {
  if (dragState){ endDrag(); return; }
  clearTimeout(pressTimer);
  pressTimer = null;
  pressTarget = null;
  moved  = false;
  swiped = false;
});

gridEl.addEventListener('contextmenu', e => {
  const tile = e.target.closest('.tile');
  if (tile){
    e.preventDefault();
    if (!reorderMode) openModal(tile.dataset.id);
  }
});

/* ================= drag to reorder ================= */
let dragState = null;

function itemCat(id){
  const it = state.items.find(i => i.id === id);
  return it ? (it.category || '') : '';
}

function toggleReorder(){
  reorderMode = !reorderMode;
  document.body.classList.toggle('reorder', reorderMode);
  const btn = document.getElementById('reorderBtn');
  if (btn) btn.classList.toggle('active', reorderMode);

  if (reorderMode){
    showToast(t('reorder.on'));
  } else {
    save();
    render();
    requestAnimationFrame(fitTiles);
    showToast(t('reorder.done'), 'ok');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && reorderMode) toggleReorder();
});

function startDrag(e, tile){
  if (tile.classList.contains('gap')) return;
  e.preventDefault();
  dragState = {
    el: tile,
    id: tile.dataset.id,
    cat: itemCat(tile.dataset.id),
    pointerId: e.pointerId,
    startX: e.clientX,
    startY: e.clientY,
    moved: false
  };
  tile.classList.add('dragging');
  tile.style.pointerEvents = 'none';
  try{ gridEl.setPointerCapture(e.pointerId); }catch(_){}
  navigator.vibrate?.(8);
}

function gridColumns(){
  const c = state.gridCols || '4';
  if (c !== 'auto') return Math.max(1, parseInt(c, 10) || 4);
  const tpl = getComputedStyle(gridEl).gridTemplateColumns || '';
  return Math.max(1, tpl.split(/\s+/).filter(Boolean).length);
}

function groupCellsOf(el){
  let first = el;
  while (first.previousElementSibling &&
         first.previousElementSibling.classList.contains('tile')){
    first = first.previousElementSibling;
  }
  const cells = [];
  for (let c = first; c && c.classList.contains('tile'); c = c.nextElementSibling){
    cells.push(c);
  }
  return cells;
}

function newGapEl(cat){
  const el = document.createElement('div');
  el.className = 'tile gap';
  el.dataset.id = '__gap_' + Date.now().toString(36) + '_' +
                  Math.random().toString(36).slice(2, 7);
  el.dataset.cat = cat || '';
  return el;
}

function swapNodes(a, b){
  const ph = document.createComment('ph');
  a.replaceWith(ph);
  b.replaceWith(a);
  ph.replaceWith(b);
}

function trimTrailingGaps(el){
  const cells = groupCellsOf(el);
  for (let i = cells.length - 1; i >= 0; i--){
    if (!cells[i].classList.contains('gap')) break;
    cells[i].remove();
  }
}

function moveDrag(e){
  const ds = dragState;
  if (!ds) return;
  if (!ds.moved){
    if (Math.abs(e.clientX - ds.startX) < 6 &&
        Math.abs(e.clientY - ds.startY) < 6) return;
    ds.moved = true;
  }
  e.preventDefault();

  const cells = groupCellsOf(ds.el);
  if (cells.length < 2) return;

  const fr = cells[0].getBoundingClientRect();
  const lr = cells[cells.length - 1].getBoundingClientRect();
  const gridRect = gridEl.getBoundingClientRect();
  const cs = getComputedStyle(gridEl);
  const gapX = parseFloat(cs.columnGap) || 0;
  const gapY = parseFloat(cs.rowGap) || 0;
  const cols = gridColumns();
  const cellW = fr.width + gapX;
  const cellH = fr.height + gapY;
  const rtl = (state.gridDir || 'ltr') === 'rtl';

  if (e.clientX < gridRect.left || e.clientX > gridRect.right) return;
  if (e.clientY < fr.top - cellH * 0.6) return;
  if (e.clientY > lr.bottom + cellH * 1.2) return;

  let col = rtl ? Math.floor((fr.right - e.clientX) / cellW)
                : Math.floor((e.clientX - fr.left) / cellW);
  let row = Math.floor((e.clientY - fr.top) / cellH);
  col = Math.max(0, Math.min(cols - 1, col));
  row = Math.max(0, row);

  const i = cells.indexOf(ds.el);
  let k = Math.min(row * cols + col, cells.length + cols);
  if (i < 0 || k === i) return;

  const target = cells[k];
  if (target && target.classList.contains('gap')){
    swapNodes(ds.el, target);
  } else {
    const g = newGapEl(ds.cat);
    ds.el.replaceWith(g);

    const now = groupCellsOf(g);
    if (k >= now.length){
      let tail = now[now.length - 1];
      for (let n = now.length; n < k; n++){
        const pad = newGapEl(ds.cat);
        tail.parentNode.insertBefore(pad, tail.nextElementSibling);
        tail = pad;
      }
      tail.parentNode.insertBefore(ds.el, tail.nextElementSibling);
    } else {
      now[k].parentNode.insertBefore(ds.el, now[k]);
    }
  }

  trimTrailingGaps(ds.el);
}

function endDrag(){
  const ds = dragState;
  if (!ds) return;
  dragState = null;
  ds.el.classList.remove('dragging');
  ds.el.style.pointerEvents = '';
  try{ gridEl.releasePointerCapture(ds.pointerId); }catch(_){}
  if (ds.moved) persistOrder();
}

function persistOrder(){
  const cells = Array.from(gridEl.querySelectorAll('.tile'));
  const byId = new Map(state.items.map(i => [i.id, i]));
  const ordered = [];
  const seen = new Set();

  for (const cell of cells){
    const id = cell.dataset.id;
    let it = byId.get(id);
    if (!it){
      it = { id, spacer: true, category: cell.dataset.cat || '', qty: 0 };
      byId.set(id, it);
    }
    if (!seen.has(id)){ ordered.push(it); seen.add(id); }
  }

  for (const it of state.items){
    if (!seen.has(it.id) && !it.spacer){ ordered.push(it); seen.add(it.id); }
  }

  state.items = ordered;
  save();
}

/* ================= selection & bumping ================= */
function qbShow(id){
  const it = state.items.find(i => i.id === id);
  if (!it || it.spacer) return;
  qbId = id;
  state.lastItem = id;
  save();
  document.querySelectorAll('.tile.selected')
    .forEach(t => t.classList.remove('selected'));
  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  if (tile) tile.classList.add('selected');
}

function bumpItem(id, n){
  const it = state.items.find(i => i.id === id);
  if (!it || it.spacer) return;
  const oldQty = it.qty;
  it.qty = Math.max(0, it.qty + n);
  it.counted = true;
  save(); render();
  flashTile(id, n, oldQty);
  navigator.vibrate?.(8);
}

function flashTile(id, dir, oldQty){
  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  const qty = tile && tile.querySelector('.qty');
  if (!qty) return;

  const newQty = qty.textContent;
  if (oldQty == null) oldQty = String(parseInt(newQty, 10) - dir);
  if (String(oldQty) === newQty) return;

  clearTimeout(qty._odoT);
  qty.classList.remove('odo-up','odo-down');

  const ghost = document.createElement('span');
  ghost.className = 'odo-ghost';
  ghost.textContent = oldQty;
  const num = document.createElement('span');
  num.className = 'odo-num';
  num.textContent = newQty;

  qty.textContent = '';
  qty.appendChild(ghost);
  qty.appendChild(num);

  void qty.offsetWidth;
  qty.classList.add(dir >= 0 ? 'odo-up' : 'odo-down');
  qty._odoT = setTimeout(() => {
    qty.classList.remove('odo-up','odo-down');
    if (ghost.parentNode) ghost.remove();
  }, 300);
}

function updateTotal(){
  let total = 0;
  for (const it of state.items) if (!it.spacer) total += it.qty;
  document.getElementById('total').textContent = nf(total);
}

/* Horizontal swipe = -1, applied in place so the tile is not re-rendered mid-gesture. */
function swipeDecrement(id){
  const it = state.items.find(i => i.id === id);
  if (!it || it.spacer) return;
  const oldQty = it.qty;
  it.qty = Math.max(0, it.qty - 1);
  it.counted = true;
  save();

  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  if (tile){
    const q = tile.querySelector('.qty');
    if (q){ q.textContent = it.qty; q.classList.toggle('zero', !it.qty); }
    tile.classList.toggle('counted', it.qty > 0);
  }
  updateTotal();
  qbShow(id);
  flashTile(id, -1, oldQty);
  navigator.vibrate?.(12);
}

function qbBump(n){
  if (!qbId) return;
  bumpItem(qbId, n);
}

/* Single tap = +1. Horizontal swipe = -1. Long-press = details. */
function tapTile(id){
  const it = state.items.find(i => i.id === id);
  if (!it || it.spacer) return;
  qbId = id;
  state.lastItem = id;
  bumpItem(id, 1);
}

/* ================= multiplier ================= */
let multPerRow = 8;
let multRows   = 9;
let multEach   = 1;

function multTotal(){
  return multPerRow * multRows * multEach;
}

function multSync(){
  document.getElementById('multPerRow').value = multPerRow;
  document.getElementById('multRows').value   = multRows;
  document.getElementById('multEach').value   = multEach;
}

function multRender(){
  const n = multTotal();
  const el = document.getElementById('multTotal');
  el.textContent = nf(n);
  el.className = n > 0 ? '' : 'zero';
}

function multDelta(which, d){
  if (which === 'perRow') multPerRow = Math.max(1, Math.min(999,  multPerRow + d));
  if (which === 'rows')   multRows   = Math.max(1, Math.min(999,  multRows + d));
  if (which === 'each')   multEach   = Math.max(1, Math.min(9999, multEach + d));
  multSync();
  multRender();
}

function multInput(which, raw){
  const n = parseInt(raw, 10);
  if (isNaN(n) || n < 1) return;
  if (which === 'perRow') multPerRow = Math.min(999, n);
  if (which === 'rows')   multRows   = Math.min(999, n);
  if (which === 'each')   multEach   = Math.min(9999, n);
  multRender();
}

function multCommit(sign){
  if (!activeId) return;
  const n = multTotal();
  if (n <= 0) return;

  bumpItem(activeId, sign * n);

  const it = state.items.find(i => i.id === activeId);
  if (it) document.getElementById('mInput').value = it.qty;

  showToast(`${sign > 0 ? '+' : '−'}${nf(n)}`, sign > 0 ? 'ok' : '');
}

[['multPerRow','perRow'],['multRows','rows'],['multEach','each']].forEach(([id, which]) => {
  const el = document.getElementById(id);
  el.addEventListener('input', e => multInput(which, e.target.value));
  el.addEventListener('change', e => { multInput(which, e.target.value); multSync(); });
});

/* ================= item window (live-save) ================= */
let modalOpenedAt = 0;

function openModal(id){
  activeId = id;
  const it = state.items.find(i => i.id === id);
  if (!it || it.spacer) return;

  document.getElementById('mName').textContent = it.name;
  document.getElementById('mCat').textContent  = it.category || '';

  const inp = document.getElementById('mInput');
  inp.value = it.qty;

  multSync();
  multRender();
  modalOpenedAt = Date.now();
  document.getElementById('modal').classList.add('on');
}

function closeModal(){
  commitLive(true);
  document.getElementById('modal').classList.remove('on');
  activeId = null;
  resetSheetLift();
}

function commitLive(silent){
  if (!activeId) return;
  const raw = document.getElementById('mInput').value;
  if (raw === '') return;
  const n = Math.max(0, parseInt(raw, 10) || 0);
  const it = state.items.find(i => i.id === activeId);
  if (!it) return;
  if (it.qty === n) return;
  it.qty = n;
  it.counted = true;
  save();
  render();
  if (!silent) navigator.vibrate?.(5);
}

function bump(n){
  const inp = document.getElementById('mInput');
  inp.value = (parseInt(inp.value) || 0) + n;
  commitLive();
}
function setZero(){
  document.getElementById('mInput').value = 0;
  commitLive();
}

document.getElementById('modal').addEventListener('click', e => {
  if (Date.now() - modalOpenedAt < 350) return;
  if (e.target.id === 'modal') closeModal();
});

document.getElementById('mInput').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); closeModal(); }
  if (e.key === 'Escape'){ e.preventDefault(); closeModal(); }
});

/* ================= lifting the sheet above the keyboard ================= */
function liftSheetForKeyboard(){
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const kb = Math.max(0, window.innerHeight - vv.height);
  const modal = document.getElementById('modal');
  if (!modal.classList.contains('on')) return;
  const sheet = modal.querySelector('.sheet');
  if (!sheet) return;
  if (kb > 60){
    sheet.style.maxHeight = (vv.height - 10) + 'px';
    sheet.style.transform = `translateY(-${kb}px)`;
  } else {
    resetSheetLift();
  }
}

function resetSheetLift(){
  document.querySelectorAll('.sheet').forEach(s => {
    s.style.transform = '';
    s.style.maxHeight = '';
  });
}

if (window.visualViewport){
  visualViewport.addEventListener('resize', liftSheetForKeyboard);
  visualViewport.addEventListener('scroll', liftSheetForKeyboard);
}

/* ================= item / category editor ================= */
function openEditor(idOrIdx, mode){
  editorMode = mode;
  editingId  = null;
  editingCat = null;

  const titleEl = document.getElementById('edTitle');
  const subEl   = document.getElementById('edSub');
  const nameEl  = document.getElementById('edName');
  const catEl   = document.getElementById('edCat');
  const nameLbl = document.getElementById('edNameLabel');
  const fldCat  = document.getElementById('edFieldCat');

  document.getElementById('catList').innerHTML =
    state.categories.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');

  if (mode === 'category'){
    fldCat.style.display = 'none';
    nameLbl.textContent = t('editor.nameCategory');
    nameEl.placeholder = t('editor.nameCategoryPh');
    if (idOrIdx === null){
      titleEl.textContent = t('editor.newCategory');
      subEl.textContent   = t('editor.subNewCategory');
      nameEl.value = '';
    } else {
      editingCat = idOrIdx;
      titleEl.textContent = t('editor.editCategory');
      subEl.textContent   = t('editor.subEditCategory');
      nameEl.value = state.categories[idOrIdx];
    }
  } else {
    fldCat.style.display = '';
    nameLbl.textContent = t('editor.name');
    nameEl.placeholder = t('editor.namePh');
    if (idOrIdx === null){
      titleEl.textContent = t('editor.newItem');
      subEl.textContent   = t('editor.subItem');
      nameEl.value = '';
      catEl.value  = '';
    } else {
      editingId = idOrIdx;
      const it = state.items.find(i => i.id === idOrIdx);
      if (!it) return;
      titleEl.textContent = t('editor.editItem');
      subEl.textContent   = t('editor.subEditItem');
      nameEl.value = it.name;
      catEl.value  = it.category || '';
    }
  }

  document.getElementById('editor').classList.add('on');
  setTimeout(() => nameEl.focus(), 60);
}

function closeEditor(){
  document.getElementById('editor').classList.remove('on');
  editingId  = null;
  editingCat = null;
}

function saveEditor(){
  const name = document.getElementById('edName').value.trim();
  if (!name){
    alert(editorMode === 'category'
      ? t('validate.category')
      : t('validate.item'));
    document.getElementById('edName').focus();
    return;
  }

  if (editorMode === 'category'){
    const dup = state.categories.findIndex((c, i) =>
      c.toLowerCase() === name.toLowerCase() && i !== editingCat);
    if (dup !== -1){ alert(t('validate.dupCat')); return; }

    if (editingCat === null){
      state.categories.push(name);
    } else {
      const old = state.categories[editingCat];
      state.categories[editingCat] = name;
      for (const it of state.items){
        if (it.category === old) it.category = name;
      }
    }
    save(); render(); renderCatList();
    closeEditor();
    return;
  }

  const cat = document.getElementById('edCat').value.trim();
  if (cat && !state.categories.includes(cat)) state.categories.push(cat);

  if (editingId){
    const it = state.items.find(i => i.id === editingId);
    if (it){ it.name = name; it.category = cat; }
  } else {
    const id = 'i' + Date.now().toString(36)
             + Math.random().toString(36).slice(2,6);
    state.items.push({
      id, name, category: cat,
      image: '', qty: 0, counted: false
    });
  }

  const touched = editingId;
  save(); render();
  closeEditor();
  if (touched && qbId === touched) qbShow(qbId);
}

document.getElementById('editor').addEventListener('click', e => {
  if (e.target.id === 'editor') closeEditor();
});

['edName','edCat'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); saveEditor(); }
    if (e.key === 'Escape'){ e.preventDefault(); closeEditor(); }
  });
});

/* ================= category management ================= */
function openCats(){ renderCatList(); document.getElementById('cats').classList.add('on'); }
function closeCats(){ document.getElementById('cats').classList.remove('on'); }

function renderCatList(){
  const box = document.getElementById('catsList');
  box.innerHTML = '';

  if (state.categories.length === 0){
    box.innerHTML = `<div class="cats-empty">${escapeHtml(t('cats.empty'))}</div>`;
    return;
  }

  state.categories.forEach((cat, idx) => {
    const count = state.items.filter(i => i.category === cat && !i.spacer).length;

    const row = document.createElement('div');
    row.className = 'cat-row';

    const name = document.createElement('div');
    name.className = 'cat-row-name';
    name.textContent = cat;
    row.appendChild(name);

    const cnt = document.createElement('div');
    cnt.className = 'cat-row-count';
    cnt.textContent = count;
    row.appendChild(cnt);

    const rn = document.createElement('button');
    rn.textContent = '✏️';
    rn.title = t('cats.rename');
    rn.onclick = () => openEditor(idx, 'category');
    row.appendChild(rn);

    const dl = document.createElement('button');
    dl.textContent = '🗑';
    dl.title = t('cats.delete');
    dl.className = 'danger';
    dl.onclick = () => deleteCategory(idx);
    row.appendChild(dl);

    box.appendChild(row);
  });
}

async function deleteCategory(idx){
  const cat = state.categories[idx];
  if (cat === undefined) return;
  const inCat = state.items.filter(i => i.category === cat && !i.spacer);
  const n = inCat.length;

  if (n === 0){
    const ok = await showPick({
      title: t('cats.deleteEmptyTitle'),
      message: t('cats.deleteEmptyMsg', {cat}),
      options: [
        {label:t('delete.confirm'), value:'yes', style:'danger'},
        {label:t('cancel'), value:null}
      ]
    });
    if (ok !== 'yes') return;
    state.categories.splice(idx, 1);
  } else {
    const choice = await showPick({
      title: t('cats.hasTitle', {cat}),
      message: t('cats.hasMsg', {n, word: pluralItems(n)}),
      options: [
        {label:t('cats.delAll'), value:'delAll', style:'danger'},
        {label:t('cats.orphan'), value:'orphan'},
        {label:t('cancel'), value:null}
      ]
    });

    if (choice === 'delAll'){
      state.items = state.items.filter(i => i.category !== cat);
      state.categories.splice(idx, 1);
      if (qbId && !state.items.find(i => i.id === qbId)){
        qbId = null;
      }
      if (state.lastItem && !state.items.find(i => i.id === state.lastItem)){
        state.lastItem = null;
      }
    } else if (choice === 'orphan'){
      for (const it of inCat) it.category = '';
      state.categories.splice(idx, 1);
    } else {
      return;
    }
  }

  const validCats = new Set(state.categories);
  state.items = state.items.filter(i =>
    !(i.spacer && i.category && !validCats.has(i.category)));

  save(); render(); renderCatList();
}

document.getElementById('cats').addEventListener('click', e => {
  if (e.target.id === 'cats') closeCats();
});
document.getElementById('settings').addEventListener('click', e => {

});

/* ================= mini dialog ================= */
function showPick({title, message, options}){
  return new Promise(resolve => {
    const el = document.getElementById('pick');
    document.getElementById('pickTitle').textContent = title;
    document.getElementById('pickMsg').textContent = message || '';

    const btns = document.getElementById('pickBtns');
    btns.innerHTML = '';

    for (const opt of options){
      const b = document.createElement('button');
      b.textContent = opt.label;
      if (opt.style) b.className = opt.style;
      b.onclick = () => {
        el.classList.remove('on');
        resolve(opt.value);
      };
      btns.appendChild(b);
    }
    el.classList.add('on');
  });
}

/* ================= CSV export ================= */
function slug(s){
  return (s || '')
    .trim()
    .replace(/[\\/:*?"<>|]+/g, '')
    .replace(/\s+/g, '-')
    .slice(0, 50) || t('slug.default');
}

function exportCSV(){
  const rows = [
    [t('csv.name'), state.label || ''],
    [t('csv.date'), state.date],
    [],
    [t('csv.category'), t('csv.item'), t('csv.qty')]
  ];
  for (const it of state.items.filter(i => !i.category && !i.spacer))
    rows.push(['', it.name, it.qty]);
  for (const cat of state.categories){
    for (const it of state.items.filter(i => i.category === cat && !i.spacer))
      rows.push([cat, it.name, it.qty]);
  }

  const csv = rows
    .map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';'))
    .join('\r\n');

  const bom = '\uFEFF';
  const url = URL.createObjectURL(
    new Blob([bom + csv], {type:'text/csv;charset=utf-8'})
  );
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t('slug.default')}-${slug(state.label)}-${state.date}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition  = null;
let listening    = false;
let restartTimer = null;

  один:1, одна:1, одну:1, одно:1,
  два:2, две:2, двух:2,
  три:3, трех:3, трёх:3,
  четыре:4, четырех:4, четырёх:4,
  пять:5, пяти:5,
  шесть:6, шести:6,
  семь:7, семи:7,
  восемь:8, восьми:8,
  девять:9, девяти:9,
  десять:10, десяти:10,
  одиннадцать:11, двенадцать:12, тринадцать:13, четырнадцать:14,
  пятнадцать:15, шестнадцать:16, семнадцать:17, восемнадцать:18,

  шестьдесят:60, семьдесят:70, восемьдесят:80, девяносто:90,
  сто:100, двести:200, триста:300, четыреста:400,
  пятьсот:500, шестьсот:600, семьсот:700, восемьсот:800, девятьсот:900,

const EN_NUMS = {
  zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8,
  nine:9, ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14,
  fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19,
  twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70,
  eighty:80, ninety:90, hundred:100, thousand:1000
};

const LV_NUMS = {
  nulle:0, viens:1, viena:1, divi:2, divas:2, tris:3, trīs:3, cetri:4,
  četri:4, cetras:4, četras:4, pieci:5, piecas:5, sesi:6, seši:6,
  sesas:6, sešas:6, septini:7, septiņi:7, septinas:7, septiņas:7,
  astoni:8, astoņi:8, astonas:8, astoņas:8, devini:9, deviņi:9,
  devinas:9, deviņas:9, desmit:10, vienpadsmit:11, divpadsmit:12,
  trispadsmit:13, trīspadsmit:13, cetrpadsmit:14, četrpadsmit:14,
  piecpadsmit:15, sespadsmit:16, sešpadsmit:16, septinpadsmit:17,
  septiņpadsmit:17, astonpadsmit:18, astoņpadsmit:18, devinpadsmit:19,
  deviņpadsmit:19, divdesmit:20, trisdesmit:30, trīsdesmit:30,
  cetrdesmit:40, četrdesmit:40, piecdesmit:50, sesdesmit:60,
  sešdesmit:60, septindesmit:70, septiņdesmit:70, astondesmit:80,
  astoņdesmit:80, devindesmit:90, deviņdesmit:90, simts:100
};

const NUM_WORDS = { ru: RU_NUMS, en: EN_NUMS, lv: LV_NUMS };

const VOICE_WORDS = {
  ru: {
    stop:  /(^| )(стоп|хватит|закончить|выключи|выключить)( |$)/,
    plus:  /(^| )(плюс|добав|прибав|плюсуй)( |$)/,
    minus: /(^| )(минус|убери|уменьши|отними)( |$)/
  },
  en: {
    stop:  /(^| )(stop|finish|turn off|off)( |$)/,
    plus:  /(^| )(plus|add|increase)( |$)/,
    minus: /(^| )(minus|remove|subtract|decrease)( |$)/
  },
  lv: {
    stop:  /(^| )(stop|beigt|izslegt|izslēgt|izslēdz)( |$)/,
    plus:  /(^| )(plus|pievieno|pieliec|palielini)( |$)/,
    minus: /(^| )(minus|mīnus|atnem|atņem|nonem|noņem|samazini)( |$)/
  },
  zh: {
    stop:  /(停止|关闭|結束|结束|停)/,
    plus:  /(加|添加|增加|加上)/,
    minus: /(减|減|减去|減去|去掉|减少|減少)/
  }
};

const VOICE_STOP = {
  ru: new Set(['плюс','минус','добавь','прибавь','убери','отними','и','в','на','для','с','к','по','мл','шт','штук','штуки','л','литров','литра']),
  en: new Set(['plus','minus','add','remove','subtract','and','in','on','for','with','to','by','ml','pcs','pieces','l','liters','litre','litres']),
  lv: new Set(['plus','mīnus','minus','pievieno','pieliec','palielini','atņem','atnem','noņem','nonem','samazini','un','ar','uz','par','no','l','ml','gab','gabali']),
  zh: new Set(['加','添加','增加','加上','减','減','减去','減去','去掉','减少','減少','和','的','个','個','升','毫升'])
};

function normalizeText(s){
  return String(s || '')
    .toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim();
}

function parseZhNumber(s){
  const digits = { '零':0,'〇':0,'一':1,'二':2,'两':2,'兩':2,'三':3,'四':4,
                   '五':5,'六':6,'七':7,'八':8,'九':9 };
  const units = { '十':10,'百':100,'千':1000,'万':10000 };
  let total = 0, section = 0, number = 0;
  for (const ch of s){
    if (digits[ch] !== undefined){ number = digits[ch]; }
    else if (units[ch] !== undefined){
      const u = units[ch];
      if (u === 10000){ section = (section + number) * u; total += section; section = 0; number = 0; }
      else { if (number === 0) number = 1; section += number * u; number = 0; }
    }
  }
  return total + section + number;
}

function extractNumber(text){
  const digits = text.match(/\d+/);
  if (digits) return parseInt(digits[0], 10);

  if (curLang() === 'zh'){
    const zh = String(text).replace(/[^\u4e00-\u9fff零〇一二两兩三四五六七八九十百千万萬]/g, '');
    const n = zh ? parseZhNumber(zh) : 0;
    return n || null;
  }

  const map = NUM_WORDS[curLang()] || RU_NUMS;
  const words = normalizeText(text).split(/\s+/);
  let sum = 0, found = false;
  for (const w of words){
    const n = map[w];
    if (n !== undefined){ sum += n; found = true; }
  }
  return found ? sum : null;
}

function matchItem(text){
  const t = normalizeText(text);
  if (!t) return null;

  const stop = VOICE_STOP[curLang()] || VOICE_STOP.ru;

  const tWords = t.split(' ').filter(w =>
    w.length >= 2 && !stop.has(w)
  );
  if (tWords.length === 0) return null;

  let best = null, bestRatio = 0;
  for (const it of state.items){
    if (it.spacer) continue;
    const nWords = normalizeText(it.name).split(' ').filter(w => w.length >= 2);
    if (nWords.length === 0) continue;

    let hit = 0;
    for (const tw of tWords){
      if (nWords.some(nw =>
        nw === tw || nw.startsWith(tw) || tw.startsWith(nw)
      )) hit++;
    }
    const ratio = hit / tWords.length;
    if (ratio > bestRatio){
      bestRatio = ratio;
      best = it;
    }
  }
  return bestRatio >= 0.5 ? best : null;
}

let toastTimer = null;
function showToast(msg, kind){
  const el = document.getElementById('voiceToast');
  el.textContent = msg;
  el.className = 'on' + (kind ? ' ' + kind : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = kind || ''; }, 2200);
}

function processVoiceCommand(rawText){
  const txt = normalizeText(rawText);
  if (!txt) return;
  console.log('[voice] heard:', rawText);

  const words = VOICE_WORDS[curLang()] || VOICE_WORDS.ru;

  if (words.stop.test(txt)){
    stopVoice();
    showToast(t('voice.off'));
    return;
  }

  const isPlus  = words.plus.test(txt)  || /\+/.test(txt);
  const isMinus = words.minus.test(txt) || /-/.test(txt);

  if (isPlus || isMinus){
    if (!qbId){
      showToast(t('voice.selectFirst'), 'warn');
      return;
    }
    const n = extractNumber(rawText) || 1;
    const delta = isMinus ? -n : n;
    qbBump(delta);
    const it = state.items.find(i => i.id === qbId);
    showToast(`${delta > 0 ? '+' : ''}${delta} — ${it ? it.name : ''}`.trim(),
              delta > 0 ? 'ok' : '');
    return;
  }

  const it = matchItem(rawText);
  if (it){
    qbShow(it.id);
    showToast(t('voice.selected', {name: it.name}), 'ok');
    return;
  }

  showToast(t('voice.notUnderstood', {text: rawText}), 'warn');
}

function startVoice(){
  if (!recognition || !listening) return;
  try{ recognition.start(); }catch(e){ /* already started */ }
}

function stopVoice(){
  listening = false;
  const btn = document.getElementById('micBtn');
  if (btn) btn.classList.remove('on');
  if (restartTimer){ clearTimeout(restartTimer); restartTimer = null; }
  if (recognition){ try{ recognition.stop(); }catch{} }
}

function toggleVoice(){
  if (!recognition){
    showToast(t('voice.unsupported'), 'warn');
    return;
  }
  if (listening){
    stopVoice();
    showToast(t('voice.off'));
  } else {
    listening = true;
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.add('on');
    startVoice();
    showToast(t('voice.listening'));
  }
}

if (SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = (LANGS[curLang()] || LANGS.ru).speech;
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++){
      const res = event.results[i];
      if (!res.isFinal) continue;
      const text = (res[0].transcript || '').trim();
      if (text) processVoiceCommand(text);
    }
  };

  recognition.onerror = (e) => {
    console.warn('[voice] error:', e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      stopVoice();
      showToast(t('voice.noMic'), 'warn');
    }
  };

  recognition.onend = () => {
    if (listening){
      if (restartTimer) clearTimeout(restartTimer);
      restartTimer = setTimeout(() => { startVoice(); }, 400);
    }
  };

  recognition.onstart = () => {
    if (restartTimer){ clearTimeout(restartTimer); restartTimer = null; }
  };
}

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101512"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Count — Bottles & Crates</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="stylesheet" href="src/styles.css"><script src="app.bundle.js" defer></script>
</head>
<body>
<div class="app-shell">
<header class="app-header"><a class="brand" href="./" aria-label="Count home"><span class="brand-mark">c·</span> count<span class="brand-description">BOTTLES & CRATES</span></a><button class="icon-button" data-action="settings" aria-label="Settings" title="Settings">⚙</button></header>
<div id="warning" class="warning" role="alert" hidden></div>
<main>
<section class="overview" aria-label="Current count"><div class="session-info"><div class="eyebrow" id="date"></div><button id="session-name" class="session-name" data-action="rename"></button><div class="save-status"><span id="status-dot"></span><span id="save-status" role="status"></span></div></div><div class="total-block"><span class="eyebrow" id="total-label">TOTAL COUNTED</span><strong id="total">0</strong><span id="progress-label"></span></div></section>
<div class="progress-track"><div id="progress-bar"></div></div>
<nav class="toolbar" aria-label="Counting tools"><div class="tool-group"><button data-action="sessions" id="sessions-button">Sessions</button><button data-action="new-session" id="new-button">+ New count</button></div><div class="tool-group"><button data-action="undo" id="undo-button" title="Undo (Ctrl+Z)">↶ <span>Undo</span></button><button data-action="redo" id="redo-button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button><button data-action="more" id="more-button" aria-label="More actions">•••</button></div></nav>
<div class="collection-heading"><div><h1 id="collection-title">Your items</h1><p id="gesture-hint">Tap +1 · Swipe −1 · Hold for more</p></div><button data-action="add-item" class="text-button" id="add-button">+ Add item</button></div>
<div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find an item…" aria-label="Find an item" autocomplete="off"></label><button data-action="reorder" id="reorder-button" aria-pressed="false" aria-label="Reorder items">↕</button></div>
<div id="grid"></div><div id="empty" class="empty" hidden>No items found.</div><footer class="page-footer"><span>CARLDARIS SORTER</span><span id="offline-label">Ready for your next count.</span></footer>
</main></div>

<aside id="quick-bar" class="quick-bar" hidden aria-label="Selected item"><div><span id="selected-label">Selected item</span><strong id="selected-name"></strong></div><button data-action="selected-minus" aria-label="Subtract one">−</button><button data-action="selected-details" id="selected-qty">0</button><button data-action="selected-plus" class="primary" aria-label="Add one">+</button></aside>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button data-action="close" class="icon-button" aria-label="Close">×</button></div><div id="dialog-content"></div></dialog>
<div id="toast" role="status" class="toast" hidden></div><input type="file" id="import-file" accept="application/json,.json" hidden><noscript>This app needs JavaScript to count and save items.</noscript>
</body></html>

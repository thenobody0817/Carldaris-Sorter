<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101512"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Count — Bottles & Crates</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="stylesheet" href="src/styles.css"><script src="app.bundle.js" defer></script>
</head>
<body>
<div class="app-shell">
<header class="app-header"><div class="bar-info"><div class="bar-left"><a class="brand" href="./" aria-label="Count home"><span class="brand-mark">c·</span><span class="brand-name">count</span></a></div><span id="session-name" class="session-name" role="button" tabindex="0" aria-label="Rename count" title="Tap to rename"></span></div><nav class="toolbar" aria-label="Counting tools"><button data-action="sessions" id="sessions-button">Sessions</button><button data-action="new-session" id="new-button">New count</button><button data-action="reset" id="reset-button">Reset</button><button data-action="undo" id="undo-button" title="Undo (Ctrl+Z)">↶ <span>Undo</span></button><button data-action="redo" id="redo-button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button><button data-action="more" id="more-button" aria-label="More actions">•••</button><button data-action="settings" class="icon-button" aria-label="Settings" title="Settings">⚙</button><button data-action="grid" id="grid-button" aria-pressed="false" aria-label="Grid layout">▦</button></nav></header>
<div id="warning" class="warning" role="alert" hidden></div>
<main>
<div id="grid-controls" class="grid-controls" hidden></div><div id="grid"></div><div id="empty" class="empty" hidden>No items found.</div>
</main></div>

<aside id="quick-bar" class="quick-bar" hidden aria-label="Selected item"><div><span id="selected-label">Selected item</span><strong id="selected-name"></strong></div><button data-action="selected-minus" aria-label="Subtract one">−</button><button data-action="selected-details" id="selected-qty">0</button><button data-action="selected-plus" class="primary" aria-label="Add one">+</button></aside>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button data-action="close" class="icon-button" aria-label="Close">×</button></div><div id="dialog-content"></div></dialog>
<div id="toast" role="status" class="toast" hidden></div><input type="file" id="import-file" accept="application/json,.json" hidden><noscript>This app needs JavaScript to count and save items.</noscript>
</body></html>
